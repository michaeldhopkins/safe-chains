# cargo-mutants configuration. Method: the `rust-mutation-testing` skill; this crate's numbers and
# decisions: docs/agents/mutation-testing.md.

# Dependencies optimized, this crate not (see the profile's comment in Cargo.toml): the suite is
# test-bound, and most of the test time was the debug binary parsing its registry on every spawn.
profile = "mutants"
# A hung mutant (a loop counter turned the wrong way) costs this multiple of the baseline test time
# before it is stopped; the default is 5, which was ~280s locally and more on the runner. Not lower:
# a legitimate mutant runs the whole suite, slower under -j2, and a spurious timeout reads as caught
# (the job summaries list every timeout so one that is not a hang gets noticed).
timeout_multiplier = 2.0

# `gen-fuzz-corpus` is a feature-gated bin. Without the feature `cargo test` never builds it, so
# every mutant in it would pass untested and read as MISSED.
features = ["fuzz-gen"]

# The corpus generator's `main` only binds this checkout's path and prints two counts; everything it
# does is `generate`, which the bin's tests run against a scratch tree. Testing `main` itself would
# mean running it, and it writes into this checkout's `fuzz/`.
# The `i += 1`/`i += 2` mutants in `content_outside_double_quotes` (`-=`, `*=`) stop the index advancing
# while the loop keeps pushing into a Vec, so they allocate without bound until the test timeout and
# only ever read as TIMEOUT. On the runner that exhausted memory and cancelled the job at 10-11
# minutes (runs 38633541332, both attempts). The function's other mutants stay.
# `HookFormat::extra_decision_pointers`'s default body is `&[]`, and the `Vec::leak(Vec::new())`
# mutant returns the same empty slice, so no caller can tell them apart.
# In the hook's `gated_policy`, `by_default` only lets `segment_kind` answer NotYet early. Every
# Boundary `segment_kind` could give instead (an agent, an unconfined runner, a protected path, a
# later run that writes) is already caught by `gate_kind`'s own word and reach checks, so `||` for
# `&&` changes no gate kind. Those checks follow links in the workspace and read every place a
# command reaches, not only the first; gate/tests.rs pins both with `by_default` true. The closure
# stays as a backstop should those checks narrow.
exclude_re = [
    'gen_fuzz_corpus\.rs:\d+:\d+: replace main with \(\)$',
    'src/parse\.rs:\d+:\d+: replace \+= with (-=|\*=) in Token::content_outside_double_quotes$',
    "src/targets/mod\\.rs:\\d+:\\d+: replace HookFormat::extra_decision_pointers -> &'static\\[&'static str\\] with Vec::leak\\(Vec::new\\(\\)\\)$",
    'src/hook_cli\.rs:\d+:\d+: replace && with \|\| in gated_policy$',
]
