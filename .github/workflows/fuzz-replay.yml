name: Fuzz replay

# The gating half of the fuzzing program (`fuzz.yml`, the burst on each push to `main`, is the
# exploring half).
#
# This is the REGRESSION gate: replay every input the burst has already accumulated against the code
# as it stands now. It is deterministic (same corpus, same answer every run), it takes minutes, and
# it answers the question a per-push job should answer: "did this change break a path we already
# explored?" No mutation here, so the gate is never randomly red.
#
# Read-only with respect to the corpus cache: the burst owns the canonical corpus and saves it under
# `fuzz-corpus-<target>-<run>`; this restores by the `fuzz-corpus-<target>-` prefix and writes
# nothing back (`tests/fuzz_targets_wired.rs` holds the two key prefixes together). Its restores
# also keep the cache inside GitHub's 7-day eviction window. On a cache miss (a fork, or a target
# the burst has not run yet) the replay is a no-op, so this degrades gracefully rather than failing.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  TRIPLE: x86_64-unknown-linux-gnu

jobs:
  replay:
    name: Replay corpus (${{ matrix.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # EVERY target, kept in step with fuzz/Cargo.toml and the burst matrix by
        # `tests/fuzz_targets_wired.rs`. A target only in the burst is never gated; one only here
        # never explores. Both halves or neither.
        target: [parse, equivalence, hook_envelope, explain_render, suggest_roundtrip, level_monotonic, config_load, setup_merge, path_admit, gate_prefilter]
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src

      # The build dominates this job's wall clock (nightly + sanitizer + instrumented std runs to
      # minutes and dwarfs the fuzzing), so caching it is what makes a per-push gate tolerable.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz

      - name: Build fuzz target
        run: cargo +nightly fuzz build ${{ matrix.target }} --target "$TRIPLE"

      # Read the burst's canonical corpus. Caches written on main are readable from PR branches.
      - name: Restore corpus
        uses: actions/cache/restore@v4
        with:
          path: fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-
          restore-keys: fuzz-corpus-${{ matrix.target }}-

      # `-runs=0` executes each corpus input exactly once and exits — no mutation, no randomness.
      - name: Replay corpus
        run: |
          set -euo pipefail
          BIN="fuzz/target/$TRIPLE/release/${{ matrix.target }}"
          mkdir -p fuzz/corpus/${{ matrix.target }} fuzz/artifacts/${{ matrix.target }}
          COUNT=$(find fuzz/corpus/${{ matrix.target }} -type f | wc -l)
          echo "Replaying $COUNT corpus inputs"
          if [ "$COUNT" -eq 0 ]; then
            echo "::notice::no corpus cached yet (the burst on main populates it) — replay skipped"
            exit 0
          fi
          "$BIN" -runs=0 -timeout=25 -rss_limit_mb=4096 \
            -artifact_prefix=fuzz/artifacts/${{ matrix.target }}/ \
            fuzz/corpus/${{ matrix.target }}

      - name: Upload findings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-replay-findings-${{ matrix.target }}
          path: fuzz/artifacts/
          if-no-files-found: ignore

      # The replay exits non-zero on a crash already; this names the artifact so the red run says
      # where to look.
      - name: Fail on crashes
        if: always()
        run: |
          hits=$(find fuzz/artifacts -type f \( -name 'crash-*' -o -name 'timeout-*' -o -name 'oom-*' \) 2>/dev/null || true)
          if [ -n "$hits" ]; then
            echo "::error::fuzzing saved crash/timeout artifacts (see the fuzz-replay-findings artifact)"
            printf '%s\n' "$hits"
            exit 1
          fi
          echo "no crash/timeout/oom artifacts"
