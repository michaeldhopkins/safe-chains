name: Fuzz replay

# The CI regression gate of the fuzzing program (discovery bursts run in the pre-release check
# before each push to `main`, never after the push in CI).
#
# This is the REGRESSION gate: replay the committed `fuzz/corpus/<target>/seed-*` inputs from the
# checkout against the code as it stands now. It is deterministic (same corpus, same answer every
# run), it takes minutes, and it answers the question a per-push job should answer: "did this
# change break a path we already explored?" No mutation here, so the gate is never randomly red.
on:
  # Nothing fuzzed reads Markdown or the mdbook sources (no include_str! of either, no .md corpus
  # inputs), so a docs-only change cannot change a replay's result.
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**"]
  pull_request:
    paths-ignore: ["**.md", "docs/**"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  TRIPLE: x86_64-unknown-linux-gnu

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  replay:
    name: Replay corpus (${{ matrix.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # EVERY target, kept in step with fuzz/Cargo.toml by `tests/fuzz_targets_wired.rs`.
        target: [parse, equivalence, hook_envelope, explain_render, suggest_roundtrip, level_monotonic, config_load, setup_merge, path_admit, gate_prefilter, config_edit, mcp_session]
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src

      # The build dominates this job's wall clock (nightly + sanitizer + instrumented std runs to
      # minutes and dwarfs the fuzzing), so caching it is what makes a per-push gate tolerable.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz

      - name: Build fuzz target
        run: cargo +nightly fuzz build ${{ matrix.target }} --target "$TRIPLE"

      # `-runs=0` executes each corpus input exactly once and exits — no mutation, no randomness.
      - name: Replay corpus
        run: |
          set -euo pipefail
          BIN="fuzz/target/$TRIPLE/release/${{ matrix.target }}"
          mkdir -p fuzz/corpus/${{ matrix.target }} fuzz/artifacts/${{ matrix.target }}
          COUNT=$(find fuzz/corpus/${{ matrix.target }} -type f | wc -l)
          echo "Replaying $COUNT corpus inputs"
          if [ "$COUNT" -eq 0 ]; then
            echo "::notice::no committed seeds for this target"
            exit 0
          fi
          "$BIN" -runs=0 -timeout=25 -rss_limit_mb=4096 \
            -artifact_prefix=fuzz/artifacts/${{ matrix.target }}/ \
            fuzz/corpus/${{ matrix.target }}

      - name: Upload findings
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-replay-findings-${{ matrix.target }}
          path: fuzz/artifacts/
          if-no-files-found: ignore

      # The replay exits non-zero on a crash already; this names the artifact so the red run says
      # where to look.
      - name: Fail on crashes
        if: always()
        run: |
          hits=$(find fuzz/artifacts -type f \( -name 'crash-*' -o -name 'timeout-*' -o -name 'oom-*' \) 2>/dev/null || true)
          if [ -n "$hits" ]; then
            echo "::error::fuzzing saved crash/timeout artifacts (see the fuzz-replay-findings artifact)"
            printf '%s\n' "$hits"
            exit 1
          fi
          echo "no crash/timeout/oom artifacts"
