[package]
name = "safe-chains"
version = "0.231.0"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
description = "Auto-allow safe bash commands in agentic coding tools"
repository = "https://github.com/michaeldhopkins/safe-chains"

# The crate ships a second, feature-gated binary (gen-fuzz-corpus), which makes a bare `cargo run`
# ambiguous — CI's "Verify COMMANDS.md is up to date" step runs exactly that. Name the default.
default-run = "safe-chains"

# The verdict snapshot is ~3.5 MB of test data, so it and its test stay out. The other fixtures
# stay in: the unit tests include_str! them, and the package's tests would not compile without them.
exclude = ["tests/fixtures/verdict_snapshot/", "tests/verdict_snapshot.rs", "tests/verdict_snapshot/"]

[[bin]]
name = "safe-chains"
path = "src/main.rs"

# Registry-derived fuzz dictionary + seed corpus generator. Feature-gated so `cargo install` never
# ships it; it reads commands/**/*.toml, which aren't in the published crate anyway.
[[bin]]
name = "gen-fuzz-corpus"
path = "src/bin/gen_fuzz_corpus.rs"
required-features = ["fuzz-gen"]

[features]
# Enables the gen-fuzz-corpus bin. No extra deps — it reuses toml + sha2 from the main build.
fuzz-gen = []

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
shell-words = "1"
toml = "0.8"
winnow = "0.7.15"

[dev-dependencies]
clap_complete = "4"
clap_mangen = "0.2"
expectrl = "0.8"
proptest = "1.10.0"
# syn + proc-macro2: tests/file_length.rs parses this crate's own source rather than scanning its
# text. Every text rule the gate has been written with was fooled by ordinary code — a `}` in
# column 0 inside a fixture string ends a module, `#[cfg(test)]` inside a string or comment starts
# one — and this crate is full of both. `span-locations` gives exact line spans.
syn = { version = "2", features = ["full", "visit"] }
proc-macro2 = { version = "1", features = ["span-locations"] }
tempfile = "3"

[lints.rust]
# `cargo fuzz` sets `--cfg fuzzing`. Declared so the compiler checks the spelling instead of
# warning about an unknown name — a typo'd `#[cfg(fuzzng)]` would silently never apply.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(fuzzing)'] }
unsafe_code = "forbid"

[lints.clippy]
struct_excessive_bools = "deny"
fn_params_excessive_bools = "deny"
match_bool = "warn"
bool_to_int_with_if = "warn"
cognitive_complexity = "warn"
too_many_lines = "warn"
collapsible_if = "deny"
too_many_arguments = "deny"
needless_range_loop = "deny"
extend_with_drain = "deny"
unwrap_used = "deny"
dbg_macro = "deny"

# For cargo-mutants only (`.cargo/mutants.toml` selects it). Every mutant reruns the whole suite, and
# the integration tests spawn the debug binary a few hundred times; unoptimized, each spawn spends
# ~0.4s parsing the registry TOML inside the dependencies. Optimizing the dependencies alone took the
# suite from 124s to 45s while this crate stays at opt-level 0, so a mutant's rebuild costs no more.
[profile.mutants]
inherits = "test"

[profile.mutants.package."*"]
opt-level = 3
