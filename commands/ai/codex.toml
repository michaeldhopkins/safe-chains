[[command]]
name = "codex"
description = "OpenAI's local coding agent that reads, modifies, and executes code on your machine. Codex runs in Agent mode by default, giving it the ability to read files, write changes, and run shell commands within your project directory. It communicates with OpenAI's API over the network, sending code context with each request. Some subcommands (cloud status/list/diff) only read, and apply modifies the worktree. exec, resume and fork run an agent session that executes shell commands and edits files; review runs one over the current changes; sandbox runs any command it is given under the Seatbelt or Landlock policy it names. debug app-server starts the app server and sends it a message, which runs an agent turn. mcp add / remove and features enable / disable write ~/.codex/config.toml, so the server command added, or the feature turned on, runs at every later start. The project is under active development with frequent CLI changes."
url = "https://github.com/openai/codex"
bare_flags = ["--help", "--version", "-V", "-h"]
examples_denied = [
    "codex exec hi",
    "codex exec --full-auto hi",
    "codex -c sandbox_mode=danger-full-access exec hi",
    "codex resume --last",
    "codex fork",
    "codex review",
    "codex sandbox macos rm -rf ~",
    "codex debug app-server",
    "codex debug app-server send-message-v2 hi",
    "codex -c approval_policy=never debug app-server send-message-v2 'rm -rf ~'",
    "codex mcp add x -- sh -c id",
    "codex mcp remove x",
    "codex features enable x",
    "codex features disable x",
]
examples_safe = [
    "codex debug app-server --help",
    "codex mcp list",
    "codex features list",
]
[command.wrapper]
valued = ["--config", "--disable", "--enable", "-c"]

[[command.sub]]
name = "apply"
level = "SafeWrite"
tolerate_unknown_short = true
tolerate_unknown_long = true

[[command.sub]]
name = "cloud"
nested_bare = true
[[command.sub.sub]]
name = "apply"
level = "SafeWrite"
tolerate_unknown_short = true
tolerate_unknown_long = true
[[command.sub.sub]]
name = "diff"
tolerate_unknown_short = true
tolerate_unknown_long = true
[[command.sub.sub]]
name = "list"
tolerate_unknown_short = true
tolerate_unknown_long = true
[[command.sub.sub]]
name = "status"
tolerate_unknown_short = true
tolerate_unknown_long = true

[[command.sub]]
name = "completion"
standalone = ["--help", "-h"]
valued = ["--shell", "-s"]
max_positional = 0

[[command.sub]]
name = "debug"
nested_bare = true
[[command.sub.sub]]
name = "app-server"
bare = false
standalone = ["--help", "-h"]
max_positional = 0

[[command.sub]]
name = "features"
nested_bare = true
[[command.sub.sub]]
name = "list"
standalone = ["--help", "-h"]
max_positional = 0

[[command.sub]]
name = "mcp"
nested_bare = true
[[command.sub.sub]]
name = "get"
tolerate_unknown_short = true
tolerate_unknown_long = true
[[command.sub.sub]]
name = "list"
tolerate_unknown_short = true
tolerate_unknown_long = true
