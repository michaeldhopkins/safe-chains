[[command]]
name = "ditto"
description = "Copy directory hierarchies and create/extract archives (CPIO via -c, optionally compressed with -z / -j; PKZip via -c -k; extraction via -x). Preserves resource forks, extended attributes, ACLs, and quarantine metadata by default on macOS; toggled with --rsrc / --norsrc / --extattr / --noextattr / --acl / --noacl / --qtn / --noqtn. --arch thins universal binaries; --bom limits the copy set."
url = "https://ss64.com/mac/ditto.html"
researched_version = "ditto (macOS 14+)"
level = "SafeWrite"
bare = false
tolerate_unknown_short = true
standalone = [
    "--acl", "--clone", "--extattr",
    "--help", "--hfsCompression",
    "--keepBinaries", "--keepParent",
    "--noacl", "--nocache", "--noclone",
    "--noextattr", "--nohfsCompression",
    "--nonAtomicCopies", "--nopersistRootless",
    "--nopreserveHFSCompression", "--noqtn",
    "--norsrc", "--password",
    "--persistRootless",
    "--preserveHFSCompression", "--qtn",
    "--rsrc", "--sequesterRsrc",
    "--segmentLargeFiles",
    "-V", "-X", "-c", "-h", "-j",
    "-k", "-v", "-x", "-z",
]
valued = [
    "--arch", "--bom", "--keepBinariesList",
    "--keepBinariesPattern", "--lang",
    "--option", "--outBom",
    "--zlibCompressionLevel",
]
examples_safe = ["ditto ./src ./dst", "ditto -c -k ./src ./out.zip"]

# ditto had NO path gate: `level = "SafeWrite"` and nothing looking at the operands, so
# `ditto ~/.ssh ./s` copied the keys into the worktree and `ditto ./src /etc/out` wrote to /etc,
# neither prompting.
#
# `read_tree` on the sources because copying hierarchies is the whole job — the operand is the
# root of a sweep, not a file ditto opens, and a root is not something the credential shield can
# clear. `last_write` puts the destination on the write face.
[command.path_gate]
positional = "read_tree"
shape = "last_write"
# --bom / --keepBinariesList are files ditto READS to decide the copy set; --outBom is one it
# WRITES. The rest are an arch name, a glob pattern, a language, an option string and a
# compression level — values, not paths.
flags = { "--bom" = "read", "--keepBinariesList" = "read", "--outBom" = "write", "--arch" = "ignore", "--keepBinariesPattern" = "ignore", "--lang" = "ignore", "--option" = "ignore", "--zlibCompressionLevel" = "ignore" }
