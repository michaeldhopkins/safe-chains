[[command]]
name = "zcmp"
aliases = ["zdiff"]
examples_safe = ["zcmp ./a.gz ./b.gz"]
examples_denied = ["zcmp ~/.ssh/id_ed25519 ./b.gz"]
description = "Wrappers that invoke cmp or diff on gzip-, bzip2-, xz-, or lzma-compressed files (selected by extension). Options are passed through to cmp(1) or diff(1)."
url = "https://www.gnu.org/software/gzip/"
researched_version = "gzip 1.x (macOS bundled)"
level = "Inert"
bare = false
tolerate_unknown_short = true

[[command]]
name = "zforce"
examples_safe = ["zforce ./a"]
examples_denied = ["zforce ~/.ssh/id_ed25519"]
description = "Rename gzip-compressed files to end in .gz so gzip(1) does not compress them twice. Files that already have .gz / -gz / _gz / .tgz / .taz suffixes, or are not gzip-compressed, are ignored. Overwrites existing files without warning."
url = "https://www.gnu.org/software/gzip/"
researched_version = "gzip 1.x (macOS bundled)"
level = "SafeWrite"
bare = false

[[command]]
name = "zless"
aliases = ["zmore"]
examples_safe = ["zless ./a.gz"]
examples_denied = ["zless ~/.ssh/id_ed25519", "zless '+!id' ./a.gz", "zmore +!id ./a.gz", "zless -o ./log ./a.gz"]
description = "Paginate compress(1)- or gzip(1)-compressed text. zless uses less(1); zmore uses more(1) (or whatever $PAGER points to). Any flags are passed through to the pager. The pager also gets the operands, so its startup commands apply: a `+` operand runs as a pager command (`+!id` runs `id` in a shell), and less's `-o FILE` copies the input to FILE."
url = "https://www.gnu.org/software/gzip/"
researched_version = "gzip 1.x (macOS bundled)"
level = "Inert"
bare = true
reads_commands_from = ["plus"]
standalone = [
    "-E", "-F", "-G", "-I", "-J", "-K", "-L", "-M", "-N", "-Q", "-R", "-S",
    "-V", "-W", "-X", "-a", "-c", "-e", "-f", "-g", "-i", "-m", "-n", "-q",
    "-r", "-s", "-w",
    "--LINE-NUMBERS", "--LONG-PROMPT", "--QUIT-AT-EOF", "--RAW-CONTROL-CHARS", "--chop-long-lines", "--help",
    "--ignore-case", "--no-init", "--quiet", "--quit-at-eof",
    "--quit-if-one-screen", "--raw-control-chars", "--silent",
    "--squeeze-blank-lines", "--version",
]
valued = [
    "-P", "-b", "-h", "-j", "-p", "-t", "-x", "-y", "-z",
    "--pattern", "--prompt",
    "--shift", "--tabs", "--tag", "--window",
]

[[command]]
name = "znew"
examples_safe = ["znew ./a.Z"]
examples_denied = ["znew /etc/x.Z"]
description = "Recompress .Z files (LZW / compress(1)) as .gz files. -f overwrites existing .gz output, -t tests integrity before deleting the original .Z, -v reports compression ratio, -9 selects gzip -9, -K keeps the .Z if it is smaller."
url = "https://www.gnu.org/software/gzip/"
researched_version = "gzip 1.x (macOS bundled)"
level = "SafeWrite"
bare = false
standalone = ["-9", "-K", "-f", "-t", "-v"]
