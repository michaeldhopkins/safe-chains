[[command]]
name = "zstdgrep"
description = "Run grep on the contents of zstandard-compressed (or uncompressed) files. Flags before the pattern are passed through to grep(1); files default to stdin when none are given."
url = "https://github.com/facebook/zstd"
examples_safe = ["zstdgrep TODO ./log.zst"]
researched_version = "zstd 1.5.6"
level = "Inert"
bare = false
tolerate_unknown_short = true

[[command]]
name = "zstdless"
description = "View zstandard-compressed (or uncompressed) files through less(1). Any flags are passed through to less. The pager also gets the operands, so its startup commands apply: a `+` operand runs as a pager command (`+!id` runs `id` in a shell), and less's `-o FILE` copies the input to FILE."
url = "https://github.com/facebook/zstd"
examples_safe = ["zstdless ./a.zst"]
researched_version = "zstd 1.5.6"
level = "Inert"
bare = true
reads_commands_from = ["plus"]
standalone = [
    "-E", "-F", "-G", "-I", "-J", "-K", "-L", "-M", "-N", "-Q", "-R", "-S",
    "-V", "-W", "-X", "-a", "-c", "-e", "-f", "-g", "-i", "-m", "-n", "-q",
    "-r", "-s", "-w",
    "--LINE-NUMBERS", "--LONG-PROMPT", "--QUIT-AT-EOF", "--RAW-CONTROL-CHARS", "--chop-long-lines", "--help",
    "--ignore-case", "--no-init", "--quiet", "--quit-at-eof",
    "--quit-if-one-screen", "--raw-control-chars", "--silent",
    "--squeeze-blank-lines", "--version",
]
valued = [
    "-P", "-b", "-h", "-j", "-p", "-t", "-x", "-y", "-z",
    "--pattern", "--prompt",
    "--shift", "--tabs", "--tag", "--window",
]
