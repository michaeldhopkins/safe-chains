[[command]]
name = "export"
description = "Marks shell variables for export to child processes' environments, or lists currently exported variables. Effects are process-local -- exported variables propagate only to subsequently spawned child processes, not to parent or sibling processes. Cannot modify the filesystem. With no names, or with -p, it prints every exported variable with its value, and the environment often holds credentials (API keys, tokens). POSIX builtin; no independent release cycle."
url = "https://man7.org/linux/man-pages/man1/export.1p.html"
level = "Inert"
bare = true
tolerate_unknown_short = true
standalone = ["-f", "-n"]
env_assignment_positionals = true
examples_safe = ["export FOO=bar", "export PATH_EXTRA=./bin", "export FOO", "export -n FOO"]
examples_denied = ["export LD_PRELOAD=/tmp/evil.so", "export RUSTC_WRAPPER=/tmp/evil", "export GIT_DIR=/tmp/evil", "export", "export -p", "export -n"]
