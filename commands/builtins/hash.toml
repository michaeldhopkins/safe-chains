[[command]]
name = "hash"
description = "Manages the shell's internal hash table that caches the paths of previously found commands. Effects are process-local to the current shell session -- listing, querying, or resetting the cache does not touch the filesystem or affect other processes. Binding a name changes which program a later bare name runs: bash's `hash -p /tmp/x/ls ls` and zsh's `hash ls=/tmp/x/ls` make every following `ls` run that file, whatever PATH holds, and zsh's `hash -d name=dir` defines a named directory. POSIX builtin; no independent release cycle."
url = "https://man7.org/linux/man-pages/man1/hash.1p.html"
level = "Inert"
bare = true
standalone = ["-d", "-l", "-r", "-t"]
examples_safe = ["hash", "hash -r", "hash -l", "hash -d", "hash ls", "hash -t ls"]
examples_denied = ["hash -p /tmp/x/ls ls", "hash ls=/tmp/x/ls", "hash -d x=/tmp"]
