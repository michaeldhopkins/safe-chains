[[command]]
name = "hadolint"
description = "Dockerfile linter. Reads Dockerfile(s) and reports issues. --no-fail / --error-rules / --ignore / --trusted-registry control reporting. Static — does not invoke Docker. Active project."
url = "https://github.com/hadolint/hadolint"
researched_version = "hadolint 2.x"
handler = "hadolint"
examples_safe = [
    "hadolint Dockerfile",
    "hadolint --no-fail -f json Dockerfile",
]
examples_denied = [
    "hadolint Dockerfile +RTS -Sx",
    "hadolint +RTS -sout -RTS Dockerfile",
    "hadolint Dockerfile --RTS",
]
[command.fallback]
level = "SafeRead"
bare = false
tolerate_unknown_short = true
standalone = [
    "--disable-ignore-pragma",
    "--help", "--no-color",
    "--no-fail",
    "--strict-labels",
    "--verbose", "--version",
    "-V", "-h", "-v",
]
valued = [
    "--config", "--failure-threshold", "--format",
    "--ignore", "--require-label",
    "--trusted-registry",
    "-c", "-f", "-t",
]
