[[command]]
name = "kubectl"
description = "Primary CLI for Kubernetes cluster management with a large and growing surface area. Read-only subcommands (get, describe, logs, events, top, explain, api-resources, api-versions, cluster-info, auth can-i/whoami, config view/get-contexts, diff, version) query cluster state. Write subcommands (apply, delete, create, edit, patch, scale, rollout, label, annotate, taint, cordon, drain) modify cluster resources. exec and port-forward open network connections into pods and can execute arbitrary code. cp copies files to/from containers. Kubernetes releases three times per year and kubectl gains new flags and subcommands in each release (e.g. --subresource was added across multiple subcommands in v1.35). config view --raw is refused: it prints the kubeconfig with its tokens, keys and passwords, which config view otherwise redacts."
url = "https://kubernetes.io/docs/reference/kubectl/"
bare_flags = ["--help", "--version", "-V", "-h"]
examples_safe = ["kubectl config view", "kubectl config view --flatten --minify"]
examples_denied = ["kubectl config view --raw", "kubectl config view --flatten --raw", "kubectl config view --raw=true", "kubectl diff -f ~/.ssh/id_rsa", "kubectl diff --filename=~/.aws/credentials", "kubectl diff -k ~/.ssh"]

[[command.sub]]
name = "api-resources"
standalone = ["--help", "--namespaced", "--no-headers", "-h"]
valued = ["--api-group", "--output", "--sort-by", "--verbs", "-o"]

[[command.sub]]
name = "api-versions"
standalone = ["--help", "-h"]

[[command.sub]]
name = "auth"
[[command.sub.sub]]
name = "can-i"
bare = false
standalone = ["--help", "-h"]
[[command.sub.sub]]
name = "whoami"
standalone = ["--help", "-h"]

[[command.sub]]
name = "cluster-info"
standalone = ["--help", "-h"]

[[command.sub]]
name = "config"
[[command.sub.sub]]
name = "current-context"
standalone = ["--help", "-h"]
[[command.sub.sub]]
name = "get-contexts"
standalone = ["--help", "--no-headers", "-h"]
valued = ["--output", "-o"]
[[command.sub.sub]]
name = "view"
standalone = ["--flatten", "--help", "--minify", "-h"]
valued = ["--output", "-o"]
flag_values = { "--output" = ["json", "yaml", "kyaml", "name", "wide", "go-template=*", "template=*", "jsonpath=*", "jsonpath-as-json=*", "custom-columns=*"], "-o" = ["json", "yaml", "kyaml", "name", "wide", "go-template=*", "template=*", "jsonpath=*", "jsonpath-as-json=*", "custom-columns=*"] }

[[command.sub]]
name = "describe"
bare = false
standalone = ["--all-namespaces", "--help", "--show-events", "-A", "-h"]
valued = ["--namespace", "--selector", "-l", "-n"]

[[command.sub]]
name = "events"
standalone = ["--all-namespaces", "--help", "--watch", "-A", "-h", "-w"]
valued = ["--for", "--namespace", "--output", "--types", "-n", "-o"]
flag_values = { "--output" = ["json", "yaml", "kyaml", "name", "wide", "go-template=*", "template=*", "jsonpath=*", "jsonpath-as-json=*", "custom-columns=*"], "-o" = ["json", "yaml", "kyaml", "name", "wide", "go-template=*", "template=*", "jsonpath=*", "jsonpath-as-json=*", "custom-columns=*"] }

[[command.sub]]
name = "explain"
bare = false
standalone = ["--help", "--recursive", "-h"]
valued = ["--api-version"]

[[command.sub]]
name = "get"
bare = false
# Any resource reads (SafeRead) EXCEPT the Secret resource, whose `-o yaml/json` dumps the base64
# `data` (credential values). `credential_first_arg` denies every name form the exact match missed —
# `secret`/`secrets`, the slash form `secret/<name>`, and qualified `secret.v1.core` — before the `*`
# glob admits it. Conservative (gates the name-list too); `describe secret` REDACTS values so it is
# not gated. https://kubernetes.io/docs/concepts/configuration/secret/
first_arg = ["*"]
credential_first_arg = ["secret", "secrets", "secret/*", "secrets/*", "secret.*", "secrets.*"]
standalone = [
    "--all-namespaces", "--help", "--no-headers", "--show-labels", "--watch",
    "-A", "-h", "-w",
]
valued = [
    "--field-selector", "--label-selector", "--namespace",
    "--output", "--selector", "--sort-by",
    "-l", "-n", "-o",
]
flag_values = { "--output" = ["json", "yaml", "kyaml", "name", "wide", "go-template=*", "template=*", "jsonpath=*", "jsonpath-as-json=*", "custom-columns=*"], "-o" = ["json", "yaml", "kyaml", "name", "wide", "go-template=*", "template=*", "jsonpath=*", "jsonpath-as-json=*", "custom-columns=*"] }

[[command.sub]]
name = "logs"
bare = false
standalone = [
    "--all-containers", "--follow", "--help", "--previous", "--timestamps",
    "-f", "-h", "-p",
]
valued = ["--container", "--namespace", "--since", "--tail", "-c", "-n"]

[[command.sub]]
name = "top"
[[command.sub.sub]]
name = "node"
standalone = ["--help", "--no-headers", "-h"]
valued = ["--selector", "--sort-by", "-l"]
[[command.sub.sub]]
name = "pod"
standalone = [
    "--all-namespaces", "--containers", "--help", "--no-headers",
    "-A", "-h",
]
valued = ["--namespace", "--selector", "--sort-by", "-l", "-n"]

[[command.sub]]
name = "version"
standalone = ["--client", "--help", "--short", "-h"]
valued = ["--output", "-o"]

[[command.sub]]
name = "diff"
bare = false
tolerate_unknown_short = true
standalone = ["--field-manager", "--force-conflicts", "--help", "--prune", "--server-side", "-h"]
valued = ["-f", "--filename", "-k", "--kustomize", "-l", "--selector", "--prune-allowlist"]

# `diff -f/--filename` and `-k/--kustomize` name local manifests that kubectl reads and sends to the
# API server for a dry run, so their values are read paths.
[command.path_gate]
flags = { "-f" = "read", "--filename" = "read", "-k" = "read", "--kustomize" = "read" }
