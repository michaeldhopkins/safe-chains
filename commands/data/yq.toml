[[command]]
name = "yq"
description = "Evaluates jq-style expressions against YAML, JSON, XML, CSV, and TOML documents. Reads from files or stdin and writes to stdout by default; the -i flag can modify files in place. No network access and no shell execution. It reads files beyond its operands through operators in the expression: load, load_str (strload), load_xml, load_props and load_base64 read any file they name, and eval evaluates a string as an expression, so a string can become one of them. env, strenv and envsubst read the environment. By mikefarah; actively maintained with frequent releases."
url = "https://mikefarah.gitbook.io/yq"
level = "Inert"
bare = false
standalone = [
    "--colors", "--exit-status", "--help", "--no-colors", "--no-doc", "--null-input",
    "--prettyPrint", "--version",
    "-C", "-M", "-N", "-P", "-V", "-e", "-h", "-r",
]
valued = [
    "--arg", "--argjson", "--expression", "--front-matter",
    "--indent", "--input-format", "--output-format",
    "-I", "-p",
]
examples_safe = ["yq .a ./a.yml", "yq eval .metadata.name ./a.yml"]
examples_denied = ["yq 'load(\"/etc/passwd\")' ./a.yml", "yq '.a = load_str(\"x\")' ./a.yml", "yq 'eval(strenv(Q))' ./a.yml", "yq --from-file ./p.yq ./a.yml"]
