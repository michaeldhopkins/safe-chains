[[command]]
name = "west"
description = "Zephyr RTOS multi-repo / build tool. Many subcommands. Read-side: `version`, `list`, `manifest`, `topdir`, `status`, `forall`, `compare`, `diff`, `help`, `config`. Write-side: `init`, `update`, `build`, `flash`, `debug`, `attach`, `boards`, `sign`, `sdk install/list/select`, `zephyr-export`, `bindesc`, `twister`, `shields`."
url = "https://docs.zephyrproject.org/latest/develop/west/index.html"
researched_version = "west 1.x"
bare_flags = ["--help", "--version", "-h", "-V"]
examples_safe = [
    "west --version",
    "west list",
    "west topdir",
    "west status",
    "west manifest --resolve",
    "west manifest --resolve --out ./resolved.yml",
    "west manifest --freeze -o ./frozen.yml",
]
examples_denied = [
    "west manifest --resolve --out ~/.ssh/authorized_keys",
    "west manifest --freeze -o /etc/hosts",
    "west update",
]

# `west manifest -o/--out` is declared as "output file, default is standard output" — the resolved
# or frozen manifest is written there. `-o` means something else on `init` (--clone-opt) and
# `update` (--fetch-opt), but both are candidate-only, so `manifest` is the only sub where a `-o`
# reaches this gate.
[command.path_gate]
flags = { "--out" = "write", "-o" = "write" }

[[command.sub]]
name = "version"
standalone = ["--help", "-h"]

[[command.sub]]
name = "list"
level = "SafeRead"
bare = true
standalone = ["--all", "--help", "--manifest-path-from-yaml", "-a", "-h"]
valued = ["--format", "-f"]

[[command.sub]]
name = "manifest"
level = "SafeRead"
bare = true
tolerate_unknown_short = true
standalone = ["--freeze", "--help", "--path", "--resolve", "--validate", "-h"]
valued = ["--out", "-o"]

[[command.sub]]
name = "topdir"
level = "SafeRead"
bare = true
standalone = ["--help", "-h"]

[[command.sub]]
name = "status"
level = "SafeRead"
bare = true
tolerate_unknown_short = true
standalone = ["--help", "-h"]

[[command.sub]]
name = "diff"
level = "SafeRead"
bare = true
tolerate_unknown_short = true
standalone = ["--help", "--quiet", "--stat", "-h", "-q", "-s"]

[[command.sub]]
name = "compare"
level = "SafeRead"
bare = true
tolerate_unknown_short = true
standalone = ["--all", "--help", "--exit-code", "-a", "-h"]

[[command.sub]]
name = "config"
level = "SafeRead"
bare = true
tolerate_unknown_short = true
standalone = ["--delete", "--global", "--help", "--list", "--local", "--system", "-D", "-d", "-h", "-l"]

[[command.sub]]
name = "help"
allow_all = true

[[command.sub]]
name = "init"
candidate = true

[[command.sub]]
name = "update"
candidate = true

[[command.sub]]
name = "forall"
candidate = true

[[command.sub]]
name = "build"
candidate = true

[[command.sub]]
name = "flash"
candidate = true

[[command.sub]]
name = "debug"
candidate = true

[[command.sub]]
name = "debugserver"
candidate = true

[[command.sub]]
name = "attach"
candidate = true

[[command.sub]]
name = "boards"
candidate = true

[[command.sub]]
name = "sign"
candidate = true

[[command.sub]]
name = "sdk"
candidate = true

[[command.sub]]
name = "zephyr-export"
candidate = true

[[command.sub]]
name = "bindesc"
candidate = true

[[command.sub]]
name = "twister"
candidate = true

[[command.sub]]
name = "shields"
candidate = true

[[command.sub]]
name = "rtt"
candidate = true

[[command.sub]]
name = "blobs"
candidate = true

[[command.sub]]
name = "completion"
candidate = true

[[command.sub]]
name = "patch"
candidate = true
