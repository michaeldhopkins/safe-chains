[[command]]
name = "gh"
description = "GitHub's official CLI, a network client: nearly every subcommand is an authenticated HTTPS call to the GitHub REST or GraphQL API (api.github.com, or a GitHub Enterprise server named by --hostname or GH_HOST) using the token in the gh config or keychain. Reads: list/view/diff/checks/status of pull requests, issues, runs, releases, repositories and the like, `gh search`, `gh auth status`, and `gh api` with GET (implicit, or -X GET when fields are sent) or a GraphQL query; the output is remote data on stdout. Remote writes: `gh run rerun` re-queues a workflow run (history kept); every create/edit/close/merge/delete verb mutates remote state and is not covered, nor is a GraphQL mutation (the word `mutation` anywhere in the query is refused) or any header but Accept and X-GitHub-Api-Version. Local reads: a typed field (`-F key=@file`, `@-` for stdin) and `--input` read a file into the request and are refused. Local writes: `gh release download` writes asset bytes to the -O/--output file or -D/--dir directory, gated as a file write (stdout with `-O -`); `--cache` writes gh's own response cache. `gh browse` opens a web browser unless -n/--no-browser. Active project releasing about every two weeks with a stable command surface; flags are added, rarely removed."
url = "https://cli.github.com/manual/"
handler = "gh"
researched_version = "v2.102.0 (2026-09-30)"
doc_body = ""
examples_safe = [
    "gh pr list --state open --json number,title",
    "gh pr view 123 --comments",
    "gh run view 789 --log-failed",
    "gh api repos/o/r/pulls --paginate --jq '.[].title'",
    "gh api repos/o/r/contents/f -X GET -f ref=main",
    "gh api graphql -f query='{viewer{login}}'",
    "gh release download v1.0 -p '*.tar.gz' -O dist/app.tar.gz",
    "gh browse --no-browser",
    "gh --version",
]
examples_denied = [
    "gh",
    "gh pr create --fill",
    "gh api repos/o/r/issues -f title=x",
    "gh api repos/o/r/pulls/1 -X PATCH -f body=x",
    "gh api graphql -f query='mutation{addStar(input:{starrableId:\"x\"}){clientMutationId}}'",
    "gh api graphql -f query='query A{viewer{login}} mutation B{addStar}' -f operationName=B",
    "gh api -X GET search/code -F q=@/etc/passwd",
    "gh api repos/o/r/pulls -H 'Authorization: token x'",
    "gh release download v1.0 -O ~/.bashrc --clobber",
    "gh release download v1.0",
    "gh browse",
]

# --version / --help at length 2.
[command.fallback]
level = "Inert"
bare = false
max_positional = 0
standalone = ["--help", "--version", "-V", "-h"]

# `gh api` — REST and GraphQL with read-only methods, narrow header
# allowlist, GraphQL mutation veto. Its logic doesn't fit any
# declarative shape; the Rust sub-handler at `gh_api` handles it.
[[command.sub]]
name = "api"
handler = "gh_api"
doc_body = "Read-only REST/GraphQL: implicit GET or explicit `-X GET`. Allowed flags: --paginate, --slurp, --silent, --include, --verbose, --jq, --template, --cache, --preview, --hostname. Headers via -H/--header limited to Accept and X-GitHub-Api-Version. -f/-F/--field/--raw-field require -X GET on REST endpoints, and a -F/--field value starting with @ (a file or stdin) is denied; on the graphql endpoint, a query containing the word mutation is denied."

# Single-sub forms (no action verb, just `gh <sub> [flags]`). Each
# references its matching [command.handler_policy.*] by name so the
# flag list isn't duplicated.
[[command.sub]]
name = "browse"
policy = "browse"
guard = "--no-browser"
guard_short = "-n"
level = "Inert"

[[command.sub]]
name = "search"
policy = "search"
level = "Inert"

[[command.sub]]
name = "status"
policy = "simple_list"
level = "Inert"

# `gh completion <shell>` prints the Cobra-generated completion script
# to stdout for shell init (canonical: `eval "$(gh completion bash)"`).
# Supported shells per `gh completion --help`: bash, fish, powershell,
# zsh.
[[command.sub]]
name = "completion"
level = "Inert"
bare = false
max_positional = 1
standalone = ["--help", "--no-descriptions", "-h"]
valued = ["--shell", "-s"]
eval_safe = true
eval_safe_flags = ["--no-descriptions", "--shell", "-s"]
[command.sub.eval_safe_flag_values]
--shell = ["bash", "fish", "powershell", "zsh"]
-s = ["bash", "fish", "powershell", "zsh"]

# Sub × action matrix. The handler walks these blocks via
# registry::try_matrix_dispatch — for each block, if tokens[1] is in
# `parents` and tokens[2] is in `actions`, validates tokens[2..]
# against the named handler_policy at the matrix's level.

# Most read-only subs share this mapping.
[[command.matrix]]
parents = [
  "alias", "attestation", "cache", "codespace", "config",
  "extension", "gist", "gpg-key",
  "issue", "label", "org", "pr", "project",
  "repo", "ruleset", "secret",
  "ssh-key", "variable", "workflow",
]
level = "Inert"
[command.matrix.actions]
checks = "checks"
diff = "diff"
list = "list"
status = "status"
verify = "simple_view"
view = "view"
watch = "simple_view"

# `run` has its own per-action policies.
[[command.matrix]]
parents = ["run"]
level = "Inert"
[command.matrix.actions]
checks = "simple_view"
diff = "simple_view"
list = "run_list"
status = "simple_view"
verify = "simple_view"
view = "run_view"
watch = "run_watch"

# `run rerun` re-queues a workflow run — SafeWrite, separate matrix.
[[command.matrix]]
parents = ["run"]
level = "SafeWrite"
[command.matrix.actions]
rerun = "run_rerun"

# `release` overrides too.
[[command.matrix]]
parents = ["release"]
level = "Inert"
[command.matrix.actions]
checks = "simple_list"
diff = "simple_list"
list = "release_list"
status = "simple_list"
verify = "simple_list"
view = "release_view"
watch = "simple_list"

# `release download` writes asset bytes — SafeWrite, requires
# -O/--output so the destination is explicit.
[[command.matrix]]
parents = ["release"]
level = "SafeWrite"
[command.matrix.actions.download]
policy = "release_download"
guard = "--output"
guard_short = "-O"

# Top-level read-only subs that aren't sub × action: `auth status`,
# `search <thing>`, `gh status`. Single-matrix entries for each.
[[command.matrix]]
parents = ["auth"]
level = "Inert"
[command.matrix.actions]
status = "simple_list"

# 17 named flag policies. Each is the flag surface for one (action) or
# (parent, action) cell of the matrix; the handler picks the right one
# at dispatch time. Listed in the same order as the original Rust
# WordSets for ease of audit.

[command.handler_policy.list]
bare = true
standalone = [
  "--all", "--archived", "--comments", "--draft",
  "--fork", "--no-archived", "--source", "--web",
  "-a", "-w",
]
valued = [
  "--app", "--assignee", "--author", "--base",
  "--env", "--head", "--jq", "--json",
  "--key", "--label", "--language", "--limit",
  "--mention", "--milestone", "--order", "--org",
  "--ref", "--repo", "--search", "--sort",
  "--state", "--template", "--topic", "--user", "--visibility",
  "-B", "-H", "-L", "-O", "-R", "-S",
  "-e", "-k", "-l", "-o", "-q", "-r", "-u",
]

[command.handler_policy.view]
bare = false
standalone = ["--comments", "--web", "--yaml", "-c", "-w", "-y"]
valued = ["--branch", "--jq", "--json", "--ref", "--repo", "--template", "-R", "-b", "-q", "-r"]

[command.handler_policy.diff]
bare = false
standalone = ["--name-only", "--patch", "--web", "-w"]
valued = ["--color", "--repo", "-R"]

[command.handler_policy.checks]
bare = false
standalone = ["--fail-fast", "--required", "--watch", "--web", "-w"]
valued = ["--interval", "--jq", "--json", "--repo", "--template", "-R", "-i", "-q"]

[command.handler_policy.status]
bare = false
standalone = ["--exit-status", "--log", "--log-failed", "--web", "-w"]
valued = ["--jq", "--json", "--repo", "--template", "-R", "-q"]

[command.handler_policy.run_list]
bare = true
standalone = []
valued = [
  "--branch", "--commit", "--created", "--event",
  "--jq", "--json", "--limit", "--repo",
  "--status", "--template", "--user", "--workflow",
  "-L", "-R", "-b", "-q", "-u", "-w",
]

[command.handler_policy.run_view]
bare = false
standalone = ["--exit-status", "--log", "--log-failed", "--verbose", "--web", "-v", "-w"]
valued = ["--attempt", "--job", "--jq", "--json", "--repo", "--template", "-R", "-j", "-q"]

[command.handler_policy.run_watch]
bare = false
standalone = ["--exit-status"]
valued = ["--interval", "--repo", "-R", "-i"]

[command.handler_policy.release_list]
bare = true
standalone = ["--exclude-drafts", "--exclude-pre-releases"]
valued = ["--jq", "--json", "--limit", "--order", "--repo", "--template", "-L", "-R", "-q"]

[command.handler_policy.release_view]
bare = false
standalone = ["--web", "-w"]
valued = ["--jq", "--json", "--repo", "--template", "-R", "-q"]

[command.handler_policy.search]
bare = false
standalone = [
  "--archived", "--draft", "--include-forks", "--locked", "--merged",
  "--no-assignee", "--no-label", "--no-milestone", "--no-project",
  "--web", "-w",
]
valued = [
  "--app", "--assignee", "--author",
  "--checks", "--closed", "--commenter", "--comments", "--committer",
  "--created", "--filename", "--followers", "--forks",
  "--good-first-issues", "--hash", "--help-wanted-issues",
  "--include", "--interactions", "--involves", "--jq", "--json",
  "--label", "--language", "--license", "--limit",
  "--match", "--mentions", "--merged-at", "--milestone",
  "--number", "--order", "--owner", "--parent", "--project",
  "--reactions", "--repo", "--review", "--review-requested", "--reviewed-by",
  "--size", "--sort", "--stars", "--state",
  "--team-mentions", "--team-review-requested", "--template",
  "--topic", "--updated", "--visibility",
  "-L", "-R", "-q",
]

[command.handler_policy.release_download]
bare = false
standalone = ["--clobber", "--skip-existing"]
valued = ["--archive", "--dir", "--output", "--pattern", "--repo", "-A", "-D", "-O", "-R", "-p"]

[command.handler_policy.simple_list]
bare = true
standalone = ["--all", "--archived", "--fork", "--no-archived", "--source", "--web", "-a", "-w"]
valued = [
  "--env", "--jq", "--json", "--key", "--language", "--limit",
  "--order", "--org", "--ref", "--repo", "--search",
  "--sort", "--template", "--topic", "--user", "--visibility",
  "-L", "-O", "-R", "-S", "-e", "-k", "-l", "-o", "-q", "-r", "-u",
]

[command.handler_policy.simple_view]
bare = false
standalone = ["--web", "--yaml", "-w", "-y"]
valued = ["--jq", "--json", "--ref", "--repo", "--template", "-R", "-q", "-r"]

[command.handler_policy.run_rerun]
bare = false
standalone = ["--debug", "--failed"]
valued = ["--job", "--repo", "-R", "-j"]

[command.handler_policy.browse]
bare = false
standalone = [
  "--actions", "--no-browser", "--projects",
  "--releases", "--settings", "--wiki",
  "-a", "-c", "-n", "-p", "-r", "-s", "-w",
]
valued = ["--branch", "--commit", "--repo", "-R", "-b"]

# `gh api` (read by the Rust walk in `src/handlers/forges/gh.rs`, which
# glab's `api` shares). `--input` (a request body from a file),
# `--allow-escape-sequences` (raw terminal escapes from a response) and
# every header outside `api_header_names` are left out.
[command.handler_policy.api]
standalone = ["--include", "--paginate", "--silent", "--slurp", "--verbose", "-i"]
valued = ["--cache", "--hostname", "--jq", "--preview", "--template", "-p", "-q", "-t"]

[command.handler_policy.api_method]
standalone = []
valued = ["--method", "-X"]

[command.handler_policy.api_header]
standalone = []
valued = ["--header", "-H"]

# Header names, not flags: the only headers a request may carry.
[command.handler_policy.api_header_names]
standalone = ["Accept", "X-GitHub-Api-Version"]
valued = []

[command.handler_policy.api_fields]
standalone = []
valued = ["--field", "--raw-field", "-F", "-f"]

# The typed field flags read a file when the value starts with `@`
# (`-F body=@notes.txt`, `@-` for stdin), so such a value is refused.
[command.handler_policy.api_file_fields]
standalone = []
valued = ["--field", "-F"]

# The flags naming where `gh release download` writes; each value
# except `-` (stdout) is gated as a file write.
[command.handler_policy.release_download_targets]
standalone = []
valued = ["--dir", "--output", "-D", "-O"]
