[[command]]
writes_cwd = "named"
name = "mkdir"
aliases = ["gmkdir"]
description = "Creates one or more local directories. Operates only on the local filesystem under the user's permissions. -p/--parents creates intermediate directories as needed; -m/--mode sets the mode; -v/--verbose prints each path created. GNU coreutils adds -Z/--context for SELinux. Stable utility on BSD and GNU; flag surface unchanged for many years."
url = "https://www.gnu.org/software/coreutils/manual/coreutils.html#mkdir-invocation"
researched_version = "GNU coreutils 9.x + BSD mkdir (macOS 15 / Sequoia)"
level = "SafeWrite"
bare = false
standalone = [
    "--help", "--parents", "--verbose", "--version",
    "-Z", "-p", "-v",
]
valued = [
    "--mode",
    "-m",
]
optional_valued = ["--context"]
examples_denied = [
    "mkdir",
    "mkdir /etc/evil",
    "mkdir -p ~/newdir",
    "mkdir ../outside",
    "mkdir -p ./a/../../x",
    "mkdir -p .git/hooks",
    "mkdir --context /etc/evil ok",
]

# Declarative facet behavior: mkdir CREATES each directory operand (trivially reversible —
# rmdir removes a fresh empty dir), gated per-operand by locus so a worktree mkdir projects to
# the dev level while `mkdir /etc/evil` denies. Scale widens on multiple operands/glob (breadth)
# but mkdir has no recursion-into-scale flag. Replaces `resolve_mkdir`.
#
# `--context` is listed as standalone here because its argument is OPTIONAL and GNU getopt takes
# it only when attached (`--context=CTX`). Listed as valued it swallowed the next word, so
# `mkdir --context /etc/evil ok` read `/etc/evil` as the context while GNU mkdir created it.
[command.behavior]
operation = "create"
positionals = "write"
scale = "breadth"
standalone = [
    "--context", "--help", "--parents", "--verbose", "--version",
    "-Z", "-p", "-v",
]
valued = [
    "--mode",
    "-m",
]
