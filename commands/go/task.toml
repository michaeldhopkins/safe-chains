[[command]]
name = "task"
description = "Task runner / build tool driven by a YAML Taskfile. Naming a task (or none, which runs `default`) executes that task's shell commands: arbitrary code from the Taskfile, the same risk profile as Make. `-l/--list`, `-a/--list-all` and `-j/--json` print task names and descriptions without running tasks, but loading the Taskfile still reads its `dotenv` files and, when it has any, evaluates the file's top-level `sh:` variables, so listing a Taskfile runs code from it; descriptions are templated and can print those values. `-d/--dir` and `-t/--taskfile` choose which Taskfile is loaded, `-g/--global` loads `$HOME/Taskfile.yml`, and `--init` writes a new Taskfile. `--status`, `--force`, `--watch`, `--parallel`, `--exit-code`, `--summary` and `--dry` act on named tasks. Network: none of its own, except Taskfiles that include remote Taskfiles over HTTP(S) (an experiment, cached locally; `--offline` stops the download, `--insecure` permits plain HTTP). `--version` and `--help` print and exit. Release cadence: a minor release roughly every one to two months, with the flag surface stable across v3."
url = "https://taskfile.dev/"
researched_version = "task 3.54.0"
level = "SafeRead"
bare = false
require_any = ["--help", "--list", "--list-all", "--version", "-a", "-h", "-l"]
standalone = [
    "--color", "--dry",
    "--help", "--insecure", "--json",
    "--list", "--list-all",
    "--no-color", "--offline",
    "--silent", "--verbose", "--version",
    "-a", "-h", "-j", "-l", "-n", "-s", "-v",
]
valued = [
    "--dir", "--output", "--taskfile",
    "-d", "-o", "-t",
]
# A task NAME is a positional, and naming a task RUNS it — arbitrary shell out of Taskfile.yml,
# which the description above already excludes from the safe surface. Without this cap the flag
# allowlist was decorative: `task build` auto-approved while every peer runner (`npm run build`,
# `make build`, `just build`, `rake build`, `mise run build`) denied.
max_positional = 0
examples_safe = [
    "task --list",
    "task -l",
    "task --list-all",
    "task --version",
    "task --dry --list",
    "task -l -d ./sub",
    "task -l --taskfile ./Taskfile.yml",
    "task --list --json",
]
examples_denied = [
    "task build",
    "task deploy",
    "task FOO=bar",
    "task default",
    "task --silent",
    "task -v",
    "task --force",
    "task --watch",
    "task --parallel",
    "task --exit-code",
    "task --global",
    "task -g",
    "task --status",
    "task --init",
    "task -i",
    "task -tl",
    "task -dl",
    "task -i --dir=/etc",
    "task --list -t=/etc/passwd",
    "task -l --taskfile=~/.ssh/id_rsa",
    "task -d /tmp/evil --list",
    "task --status --dir=/tmp/evil",
]

# `--dir` and `--taskfile` pick the Taskfile that gets loaded, and loading one evaluates its `sh:`
# variables whenever it declares `dotenv` (task 3.54.0 `setup.go`, `readDotEnvFiles` calling
# `GetTaskfileVariables` with shell evaluation on), even for `--list`. So the value selects code
# to run, and is gated by where that code comes from rather than as a plain read.
[command.path_gate]
flags = { "--dir" = "exec", "-d" = "exec", "--taskfile" = "exec", "-t" = "exec" }
