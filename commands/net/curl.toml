[[command]]
name = "curl"
description = "Transfers data to or from a URL. As approved here it is an HTTP client that only reads: it makes a network request to each operand that starts with http:// or https://, with a GET, HEAD or OPTIONS method, and prints the response, so the exposure is the request itself, which reaches whatever host and path the URL names, a local service on localhost included, and any credential the command line carries in an Authorization or Cookie header. A redirect (-L) is followed by curl on its own terms and can leave http and https. Every other scheme as an operand (file, ftp, gopher, dict, ldap, a scheme-less guess such as example.com, a {a,b} or [a-b] glob ahead of the scheme) is refused, as are bodies, uploads, cookie jars, credential flags, -K config files and every flag=value spelling. curl also reads a .curlrc of its own which no approved command can switch off (-q is not admitted). -w/--write-out takes an inline format only: @file reads a file and %output{} writes one. -o and -O write the response to a file. Header names come from a fixed set that cannot set the method or the body, and neither a header value nor a user-agent (-A) may hold a line break. curl releases every six to eight weeks (8.23.0 on 2026-10-14) with the flag surface it has had for years; flags added in a release are unknown here and stay refused until researched."
url = "https://curl.se/docs/manpage.html"
researched_version = "curl 8.23.0 (2026-10-14)"
handler = "curl"
doc_body = "Allowed standalone flags: --compressed, --fail, --globoff, --head, --include, --insecure, --ipv4, --ipv6, --location, --no-buffer, --no-progress-meter, --show-error, --silent, --verbose, -4, -6, -I, -L, -N, -S, -f, -g, -i, -k, -s, -v. Allowed valued flags: --connect-timeout, --max-time, --user-agent, --write-out, -A, -m, -w. Allowed methods (-X/--request): GET, HEAD, OPTIONS. URL operands: http:// or https:// only (any case); no scheme-less, file, ftp, gopher, dict or ldap operands, and no glob before the scheme. --help, -h, --version and -V are allowed alone. -w/--write-out: inline format only (no @file, no %output). Flag values are given as a separate word: every --flag=value spelling is refused. -H/--header: Accept, Accept-Charset, Accept-Encoding, Accept-Language, Authorization, Cache-Control, Cookie, If-Match, If-Modified-Since, If-None-Match, If-Range, If-Unmodified-Since, Origin, Range, Referer, User-Agent, X-Correlation-ID, X-Forwarded-For, X-Forwarded-Host, X-Forwarded-Proto, X-GitHub-Api-Version, X-Request-ID and X-Requested-With only, and no header or -A value may hold a line break. -X/--request: GET, HEAD or OPTIONS. -o/--output and -O/--remote-name write a file."
examples_safe = [
    "curl -s https://example.com",
    "curl -sSL -I https://example.com",
    "curl -s -H 'Accept: application/json' https://api.github.com/zen",
    "curl -s -w '%{http_code}' -o /dev/null https://example.com",
    "curl --version",
    "curl -s 'https://example.com/[1-3]'",
]
examples_denied = [
    "curl -H 'Content-Type: application/json' https://example.com",
    "curl -s -L gopher://example.com/",
    "curl -X POST https://example.com",
    "curl -d 'a=b' https://example.com",
    "curl file:///etc/hosts",
    "curl example.com",
    "curl -w @fmt.txt https://example.com",
    "curl -w '%output{x.txt}' https://example.com",
    "curl --max-time=30 https://example.com",
]

[command.handler_policy.options]
standalone = [
    "--compressed", "--fail", "--globoff", "--head", "--include", "--insecure", "--ipv4",
    "--ipv6", "--location", "--no-buffer", "--no-progress-meter", "--show-error", "--silent",
    "--verbose", "-4", "-6", "-I", "-L", "-N", "-S", "-f", "-g", "-i", "-k", "-s", "-v",
]
valued = ["--connect-timeout", "--max-time", "--user-agent", "--write-out", "-A", "-m", "-w"]

[command.handler_policy.methods]
standalone = ["GET", "HEAD", "OPTIONS"]

[command.handler_policy.headers]
standalone = [
    "Accept", "Accept-Charset", "Accept-Encoding", "Accept-Language", "Authorization",
    "Cache-Control", "Cookie", "If-Match", "If-Modified-Since", "If-None-Match", "If-Range",
    "If-Unmodified-Since", "Origin", "Range", "Referer", "User-Agent", "X-Correlation-ID",
    "X-Forwarded-For", "X-Forwarded-Host", "X-Forwarded-Proto", "X-GitHub-Api-Version",
    "X-Request-ID", "X-Requested-With",
]
