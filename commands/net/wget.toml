[[command]]
name = "wget"
description = "Non-interactive HTTP/HTTPS/FTP downloader. Network read; writes downloaded files locally (project-local SafeWrite). Many flags control mirror / continuation / cookies / ssl / proxies. Mature, ubiquitous tool."
url = "https://www.gnu.org/software/wget/"
researched_version = "GNU Wget 1.x"
level = "SafeWrite"
bare = false
tolerate_unknown_short = true
standalone = [
    "--ask-password", "--auth-no-challenge", "--background", "--backup-converted", "--backups",
    "--cache", "--check-certificate", "--content-disposition", "--continue",
    "--convert-file-only", "--convert-links", "--debug", "--delete-after", "--dns-cache",
    "--dont-remove-listing", "--follow-ftp", "--force-directories",
    "--force-html", "--ftp-stmlf", "--help", "--hsts", "--html-extension",
    "--http-keep-alive", "--ignore-case", "--ignore-length", "--inet4-only", "--inet6-only",
    "--keep-badhash", "--keep-session-cookies", "--metalink-over-http", "--mirror",
    "--no-check-certificate", "--no-clobber", "--no-config", "--no-cookies",
    "--no-directories", "--no-dns-cache", "--no-glob", "--no-host-directories", "--no-hsts",
    "--no-http-keep-alive", "--no-iri", "--no-parent", "--no-passive-ftp", "--no-proxy",
    "--no-remove-listing", "--no-use-server-timestamps", "--no-verbose",
    "--no-warc-compression", "--no-warc-digests", "--no-warc-keep-log", "--page-requisites",
    "--passive-ftp", "--preserve-permissions", "--protocol-directories",
    "--proxy", "--quiet", "--random-wait", "--recursive", "--relative", "--report-speed",
    "--retr-symlinks", "--retry-connrefused", "--save-headers", "--server-response",
    "--show-progress", "--span-hosts", "--spider", "--strict-comments", "--timestamping",
    "--unlink", "--use-server-timestamps", "--verbose", "--version",
    "--warc-cdx", "--xattr", "-4", "-6", "-E", "-F", "-H", "-K", "-L", "-N",
    "-S", "-V", "-b", "-c", "-d", "-h", "-k", "-m", "-nc", "-nd", "-nh", "-nv", "-p",
    "-q", "-r", "-s", "-v", "-x", "-Z"
]
valued = [
    "--certificate", "--certificate-type", "--ciphers", "--config", "--connect-timeout",
    "--crl-file", "--cut-dirs", "--directory-prefix", "--dns-servers", "--dns-timeout",
    "--domains", "--egd-file", "--exclude-directories", "--exclude-domains", "--execute",
    "--follow-tags", "--ftp-password", "--ftp-user", "--header", "--hsts-file",
    "--http-password", "--http-user", "--ignore-tags", "--include-directories", "--input-file",
    "--input-metalink", "--level", "--limit-rate", "--load-cookies", "--local-encoding",
    "--max-redirect", "--metalink-index", "--output-document", "--output-file", "--password",
    "--post-data", "--post-file", "--prefer-family", "--preferred-location", "--private-key",
    "--private-key-type", "--progress", "--proxy-password", "--proxy-user", "--quota",
    "--random-file", "--read-timeout", "--referer", "--regex-type", "--reject", "--reject-regex",
    "--rejected-log", "--remote-encoding", "--retry-on-http-error", "--save-cookies",
    "--secure-protocol", "--start-pos", "--timeout", "--tries", "--user", "--user-agent",
    "--wait", "--waitretry", "--warc-dedup", "--warc-file", "--warc-header", "--warc-max-size",
    "--warc-tempdir", "-A", "-B", "-D", "-I", "-O", "-P", "-Q", "-R", "-T", "-U", "-X", "-Y",
    "-a", "-e", "-i", "-l", "-o", "-t", "-w"
]
optional_valued = ["--cookies", "--restrict-file-names"]
examples_safe = [
    "wget https://example.com/a.tar.gz",
    "wget -a ./wget.log https://example.com",
    "wget --hsts-file ./hsts https://example.com",
    "wget --cookies=off https://example.com",
]
examples_denied = [
    "wget -a ~/.bashrc https://example.com",
    "wget -a/etc/x https://example.com",
    "wget --rejected-log ~/.bashrc https://example.com",
    "wget --hsts-file ~/.bashrc https://example.com",
    "wget --load-cookies ~/.ssh/id_rsa https://example.com",
    "wget --private-key ~/.ssh/id_rsa https://example.com",
    "wget --use-askpass /tmp/evil.sh https://example.com",
    "wget --warc-dedup ~/.ssh/id_rsa --warc-file=./w https://example.com",
]

[command.path_gate]
flags = { "--output-file" = "write", "--input-file" = "read" }
