[[command]]
name = "at"
description = "BSD/POSIX scheduled-job utility for queuing shell commands to run at a later time via launchd's atrun. `at <time>` reads commands from stdin or -f file and spools them to /usr/lib/cron/jobs/ for atrun to execute under the user's shell. atrun is disabled by default on macOS, but enabling it is a per-system decision and once enabled at-spooled jobs run with the invoking user's environment, working directory, and uid. Listing the queue (`at -l`) and removing a queue entry (`at -r`) only affect the user's own at queue. Examining a queued job (`at -c <jobid>`) prints its script, which begins with an export line for every variable in the environment it was queued from, credentials included. POSIX surface; flags are essentially frozen."
url = "https://man7.org/linux/man-pages/man1/at.1p.html"
researched_version = "POSIX at(1); BSD implementation on macOS, surface frozen"
level = "SafeWrite"
bare = false
require_any = ["-d", "-l", "-r"]
standalone = ["--help", "-d", "-l", "-r"]
valued = ["-q"]
examples_safe = ["at -l", "at -r 3"]
examples_denied = [
    "echo ls | at now",
    "at -c 3",
    "at -c 3 now",
    "at now",
    "at -f x.sh now",
    "at -m now + 1 minute",
    "at -t 202601010000",
    "at -l -f x.sh now",
    "at -q a now",
    "at -b",
    "at -V",
    "echo ls | batch",
    "batch -f x.sh",
]

[[command]]
name = "atq"
description = "Lists the invoking user's pending at(1) jobs (or every user's jobs if run as superuser). Read-only query of the at spool directory."
url = "https://man7.org/linux/man-pages/man1/atq.1p.html"
researched_version = "POSIX at(1); surface frozen"
level = "Inert"
bare = true
standalone = ["--help", "-V", "-v"]
valued = ["-q"]
examples_safe = ["atq", "atq -q b"]
examples_denied = ["atq -f x.sh"]

[[command]]
name = "atrm"
writes_cwd = "none"
description = "Removes one or more pending at(1) jobs by job id. Modifies the local at spool but does not execute arbitrary code; restricted to the invoking user's own jobs (or anyone's, for the superuser)."
url = "https://man7.org/linux/man-pages/man1/atrm.1p.html"
researched_version = "POSIX at(1); surface frozen"
level = "SafeWrite"
bare = false
standalone = ["--help", "-V"]
max_positional = 16
examples_safe = ["atrm 3"]
examples_denied = ["atrm"]

[[command]]
name = "batch"
description = "Queues a shell-script job, read from stdin or -f file, to run when the load average allows: `at -q b -m now`, with the same atrun-based execution model as at(1), so jobs run with the invoking user's environment and uid. Queuing is refused, as for at. Only --help and -h are approved: getopt rejects them before anything is read, so batch prints its usage line and exits. -V is refused, since BSD batch prints its version and then reads and queues a job. Offline: nothing reaches the network. The BSD surface is unchanged in years."
url = "https://man.freebsd.org/cgi/man.cgi?query=batch"
researched_version = "BSD at(1) on macOS; surface frozen"
level = "Inert"
bare = false
require_any = ["--help", "-h"]
standalone = ["--help", "-h"]
max_positional = 0
examples_safe = ["batch --help", "batch -h"]
examples_denied = ["batch", "echo ls | batch", "batch -f x.sh", "batch -V", "batch --help -f x.sh"]
