[[command.sub]]
name = "reshim"
writes_cwd = "none"
level = "SafeWrite"
standalone = ["--force", "--help", "-h"]

[[command.sub]]
name = "use"
level = "SafeWrite"
bare = false
standalone = [
    "--force", "--fuzzy", "--global", "--help", "--pin", "--quiet",
    "--remove", "--verbose", "-f", "-g", "-q", "-v", "-h",
]
valued = ["--cd", "--env", "--path", "-E", "-e", "-p"]
refuse_operands = ["*{{*", "*{%*", "*{#*", "*[*"]

[[command.sub]]
name = "install"
writes_cwd = "none"
level = "SafeWrite"
standalone = [
    "--force", "--help", "--quiet", "--verbose",
    "-f", "-q", "-v", "-h",
]
valued = ["--jobs", "-j"]
refuse_operands = ["*[*"]

[[command.sub]]
name = "uninstall"
writes_cwd = "none"
level = "SafeWrite"
bare = false
standalone = ["--all", "--dry-run", "--help", "-a", "-n", "-h"]

[[command.sub]]
name = "upgrade"
writes_cwd = "source"
level = "SafeWrite"
standalone = ["--dry-run", "--help", "--interactive", "-h", "-i", "-n"]
valued = ["--jobs", "-j"]
refuse_operands = ["*[*"]

[[command.sub]]
name = "prune"
writes_cwd = "none"
level = "SafeWrite"
standalone = ["--dry-run", "--help", "--plugins", "--tools", "-n", "-h"]

[[command.sub]]
name = "trust"
level = "SafeRead"
guard = "--show"
standalone = ["--all", "--help", "--quiet", "--show", "-a", "-h", "-q"]

[[command.sub]]
name = "untrust"
level = "SafeWrite"
standalone = ["--all", "--help", "-a", "-h"]

[[command.sub]]
name = "set"
level = "SafeWrite"
standalone = ["--help", "--remove", "-h"]
valued = ["--env", "--file", "-E", "-f"]
refuse_operands = ["*{{*", "*{%*", "*{#*", "_", "_.*"]

[[command.sub]]
name = "unset"
level = "SafeWrite"
standalone = ["--global", "--help", "-g", "-h"]
valued = ["--file", "-f"]

[[command.sub]]
name = "self-update"
profile = "supply-chain-build"
fact = "`mise self-update [VERSION]` installs the newest stable release (or VERSION) from GitHub Releases, verifies its signature, replaces the running mise binary, and also updates installed plugins unless --no-plugins is given."
source = "https://mise.jdx.dev/cli/self-update.html"
judgment = "The nearest archetype: network-sourced code is fetched and installed as an executable that runs later. The locus is the mise binary's own directory rather than a worktree, and the download is signature-checked, which the archetype does not say."
standalone = ["--force", "--help", "--no-plugins", "--yes", "-f", "-h", "-y"]
valued = ["--minimum-release-age"]

