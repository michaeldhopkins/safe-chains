[[command]]
name = "mise"
description = "Polyglot dev tool and runtime version manager (successor to rtx, alternative to asdf) that also manages environment variables and runs tasks. State: tools live under ~/.local/share/mise, settings and config in mise.toml files (project, ~/.config/mise), caches under ~/.cache/mise; reads are free of side effects, writes are recoverable by editing the file or reinstalling. Network: install, upgrade, use, uninstall, ls-remote, latest, search, registry, outdated, lock and plugins fetch version lists and downloads from GitHub, registries and package indexes; install and upgrade then run the backend's own code (a plugin script, ruby-build, npm, pipx, cargo or go install), so what they run comes from the network and persists as installed executables and shims. Read-only queries: ls/list, current, which, where, latest, ls-remote, outdated, registry, search, bin-paths, env (prints every variable mise sets, values included, and those may come from secrets files), tool, doctor, completion, config get/ls, settings get/ls, tasks ls/deps/info, cache path, backends ls. Config writers: use, set, unset, config set, settings set/add/unset, tool-alias and shell-alias set/unset, trust/untrust, tasks add/edit, edit, fmt. Executors: exec (and x), run (and r), tasks run, watch, en and shell run commands under mise's environment (activate only prints a shell script). Config is code: a mise.toml value may hold a template whose exec() runs a command, and [env] directives, hooks and tasks run commands, so a file must be trusted first; trust is granted by mise trust and automatically by mise install, exec, run and watch for the active config. self-update downloads the newest release (or VERSION) from GitHub Releases, verifies its signature and replaces the running binary and installed plugins; implode deletes mise and all its data. Releases come very often, several times a week, on a YYYY.M.N scheme (v2026.10.18 on 2026-10-23), and new subcommands (bootstrap, deps, dotfiles, install-into, oci, ssh, tool-stub, packslip) keep appearing."
url = "https://mise.jdx.dev/cli/"
researched_version = "v2026.10.18 (2026-10-23; YYYY.M.N scheme)"
env_assignment_positionals = true
# `mise set NAME=VALUE` writes the variable into mise.toml's [env], which mise then injects
# into every command run in that directory — persistently, across sessions. That is the
# `VAR=value cmd` prefix with a config file behind it, so the values are classified the same
# way. Declared at command level rather than on the `set` sub, so any future sub that assigns a
# variable is covered too; an unlisted NAME classifies Inert, so an unrelated assignment is
# unaffected (`mise set FOO=bar` and `mise set NODE_ENV=production` still allow).
bare_flags = ["--help", "--version", "-V", "-h"]
examples_safe = [
    "mise list",
    "mise use ruby@4.0.3",
    "mise u ruby@4.0.3",
    "mise install ruby@4",
    "mise i ruby@4",
    "mise uninstall ruby@4",
    "mise rm ruby@4",
    "mise remove ruby@4",
    "mise upgrade",
    "mise up",
    "eval \"$(mise activate bash)\"",
    "eval \"$(mise activate bash --shims)\"",
    "eval \"$(mise activate /bin/zsh --quiet)\"",
    "mise set FOO=bar",
    "mise set NODE_ENV=production",
    "mise set --file ./mise.toml FOO=bar",
    "mise set -E staging FOO=bar",
    "mise unset FOO",
    "mise use --path ./mise.toml ruby@4.0.3",
    "mise u -p ./mise.toml ruby@4.0.3",
]
examples_denied = [
    "mise install 'cargo:ripgrep[postinstall=touch pwned]'",
    "mise i 'node@20[postinstall=touch pwned]'",
    "mise upgrade 'cargo:ripgrep[postinstall=touch pwned]'",
    "mise up 'node[postinstall=touch pwned]'",
    "mise install cargo:rg{\\[,}x",
    "mise exec 'node[postinstall=touch pwned]' -- true",
    "mise exec",
    "mise trust",
    "mise trust .",
    "mise trust --all",
    "mise trust --ignore",
    "mise trust -a -q",
    "mise tasks run my-task",
    "mise self-update",
    "mise self-update --yes",
    "eval \"$(mise activate --help)\"",
    "eval \"$(mise list)\"",
    "eval \"$(mise activate $SHELL)\"",
    "mise set --file ./mise.toml FOO='{{ exec(command=\"touch pwned\") }}'",
    "mise set FOO='{{ exec(command=\"id\") }}'",
    "mise set FOO='x{{ env.HOME }}'",
    "mise set FOO='{% if true %}x{% endif %}'",
    "mise set FOO='{# comment #}'",
    "mise set -E prod 'FOO={{ exec(command=\"id\") }}'",
    "mise set --file='./mise.toml' 'FOO={{ exec(command=\"id\") }}'",
    "mise set _.source=./x.sh",
    "mise set _.path=/tmp/bin",
    "mise set _=x",
    "mise set -- _.source=./x.sh",
    "mise use 'node@{{ exec(command=\"id\") }}'",
    "mise u 'node@{% if true %}20{% endif %}'",
    "mise use 'node@{# x #}'",
    "mise use 'cargo:ripgrep[features=pcre2]'",
    "mise u 'cargo:ripgrep[postinstall=id]'",
    'mise set "FOO=$(cat payload.txt)"',
    'mise set FOO=`cat payload.txt`',
    'mise set "FOO=$X"',
    'mise set FOO={\{x}}',
    'mise set _{\.,}source=./x.sh',
    'mise use node@{\{x}}',
    'mise u cargo:rg{\[,}x',
    "mise set --file ~/.config/mise/conf.d/x.toml FOO=bar",
    "mise set --file=/etc/mise/config.toml FOO=bar",
    "mise unset --file ~/.config/mise/config.toml FOO",
    "mise use --path ~/.config/mise/config.toml node@20",
    "mise u -p ~/mise.toml node@20",
    "mise use --cd ~ node@20",
]

[[command.sub]]
name = "list"
standalone = [
    "--current", "--help", "--installed", "--json", "--missing",
    "--no-header", "--prefix",
    "-J", "-c", "-h", "-i", "-m",
]

[[command.sub]]
name = "ls"
standalone = [
    "--current", "--help", "--installed", "--json", "--missing",
    "--no-header", "--prefix",
    "-J", "-c", "-h", "-i", "-m",
]

[[command.sub]]
