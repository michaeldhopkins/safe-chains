[[command]]
name = "pulumi"
description = "Infrastructure-as-code platform that lets developers define cloud infrastructure using general-purpose programming languages (TypeScript, Python, Go, C#, etc.). The full CLI can create, update, and destroy cloud resources via the up and destroy subcommands, which provision real infrastructure and can incur costs or delete production systems. The covered subcommands include preview (computes a diff of what would change without applying it -- note this still runs provider code and may make read-only API calls to cloud providers), stack inspection (ls, output, history, graph, tag), logs (streams application logs), config (views stack configuration), whoami, about, console, schema check, and version. Preview is the highest-risk covered operation as it executes program code and contacts cloud APIs, though it does not apply changes. Pulumi releases roughly weekly with an active development pace."
url = "https://www.pulumi.com/docs/cli/"
bare_flags = ["--help", "-h"]

# `-C` / `--cwd` ("run pulumi as if it had been started in another directory") is a GLOBAL flag: it
# reaches every subcommand and relocates the whole invocation rather than naming an operand. Its
# value IS the locus the command then acts on, so gating it is what keeps a subcommand's
# classification true — `pulumi config -C /etc` would read a project there while the entry describes
# reading the current one.
#
# Gated `read` because the only admitted subcommand is the bare `config` listing, which reads
# `Pulumi.yaml` and `Pulumi.<stack>.yaml` in whatever directory it is pointed at. A future WRITE
# subcommand needs this re-examined: the flag would then relocate a write and `read` would
# under-gate it. Declared at COMMAND level, matching the flag's own global scope.
[command.path_gate]
flags = { "-C" = "read", "--cwd" = "read" }

[[command.sub]]
name = "version"

[[command.sub]]
name = "whoami"
standalone = ["--help", "--json", "-h"]

[[command.sub]]
name = "about"
standalone = ["--help", "--json", "--transitive", "-h"]

[[command.sub]]
name = "preview"
level = "SafeRead"
standalone = [
    "--diff", "--help", "--json", "--non-interactive",
    "--refresh", "--show-config", "--show-reads",
    "--show-replacement-steps", "--show-sames",
    "--suppress-outputs", "--suppress-permalink",
    "-h", "-j",
]
valued = [
    "--config", "--config-file", "--parallel", "--stack",
    "--target", "-c", "-p", "-s", "-t",
]

[[command.sub]]
name = "stack"
[[command.sub.sub]]
name = "ls"
standalone = ["--all", "--help", "--json", "-a", "-h"]
valued = ["--organization", "--project", "--tag", "-o"]
[[command.sub.sub]]
name = "output"
standalone = ["--help", "--json", "--show-secrets", "-h", "-j"]
valued = ["--stack", "-s"]
[[command.sub.sub]]
name = "history"
standalone = ["--help", "--json", "--show-secrets", "-h"]
valued = ["--page", "--page-size", "--stack", "-s"]
[[command.sub.sub]]
name = "tag"
bare = false
standalone = ["--help", "-h"]
[[command.sub.sub]]
name = "graph"
standalone = ["--help", "-h"]
valued = ["--dependency-edge-color", "--parent-edge-color", "--stack", "-s"]

[[command.sub]]
name = "logs"
standalone = ["--follow", "--help", "--json", "-f", "-h"]
valued = ["--resource", "--since", "--stack", "-r", "-s"]

# `config` declared only `nested_bare = true` — no nested subs, no flags, no positional bound — and
# `max_positional` defaults to UNLIMITED, so every token after it was an unremarkable positional.
# Unknown FLAGS denied while unknown POSITIONALS passed, which admitted `pulumi config set k v` and
# `pulumi config rm k`: mutations of stack configuration, which is remote state under the service
# backend and can hold secrets. Only `--secret` refused, and only because it was an unlisted flag.
#
# Declaring the read sub makes the mutators deny by OMISSION, which is the direction this file wants.
# `set`, `rm`, `cp`, `refresh`, `set-all` and `rm-all` all change stack state and need their own
# research before any of them is listed (see TODO.md).
# Bounded to the BARE listing. `pulumi config` with no arguments lists the stack's configuration
# with secret values masked as `[secret]`; `--show-secrets` is not listed, so the unmasking spelling
# is an unknown flag and refuses. Measured against pulumi v3.255.0.
#
# Every sub-form stays out — the real names are `get`, `set`, `set-all`, `remove`, `remove-all`,
# `copy`, `refresh`, `env`. `get` is out for its own reason: `--show-secrets` exists ONLY on the
# listing form ("show secret values when listing config instead of displaying blinded values"), so
# blinding is a property of LISTING. `get` has no such flag and no blinding concept, so it returns
# the value directly — plaintext for a secret key. That is the `decrypt-read` archetype, at yolo,
# not the SafeRead it was briefly given. `set` and friends cannot be admitted either, and not
# because of where they write: the write target is a local `Pulumi.<stack>.yaml` under any backend,
# but the BACKEND itself is ambient (login state or `PULUMI_BACKEND_URL`), so a bare `set` may
# consult the service and the command string cannot rule it out.
#
# `max_positional = 0` is what makes the bound real: without it the entry accepts any number of
# positionals, which is how `pulumi config set k v` was admitted in the first place.
[[command.sub]]
name = "config"
nested_bare = true
max_positional = 0
standalone = ["--help", "-h", "--json"]
valued = ["--cwd", "--stack", "-C", "-s"]

[[command.sub]]
name = "gen-completion"
bare = false
standalone = ["--help", "-h"]

[[command.sub]]
name = "console"
standalone = ["--help", "-h"]

[[command.sub]]
name = "schema"
[[command.sub.sub]]
name = "check"
standalone = ["--help", "-h"]
