[[command]]
name = "cat"
aliases = ["gcat"]
description = "Concatenates files and writes them to stdout. Observe-only: it opens each operand for reading in order (`-` is standard input) and never modifies, creates or deletes anything; where the output goes is decided by the shell, not by cat. Every operand is a content read, so what it exposes depends on which file is named: a credential file such as a private key is read in full and shown to whoever holds the output, and a FIFO or device operand can block. It runs no code and makes no network connection of its own, and the formatting flags (-n, -b, -s, -v, -E, -T, -A, -e, -t) only change how bytes are displayed. -u is ignored. Part of GNU coreutils (9.12), which has a stable release cadence of a few releases a year; the cat interface has been unchanged for decades, and BSD cat adds only -l (a lock) and lacks the long options and GNU's -A, -E and -T."
researched_version = "GNU coreutils 9.12"
url = "https://www.gnu.org/software/coreutils/manual/coreutils.html#cat-invocation"
level = "Inert"
bare = true
standalone = [
    "-A", "-E", "-T", "-V", "-b", "-e", "-h", "-l", "-n", "-s", "-t", "-u", "-v",
    "--help", "--number", "--number-nonblank", "--show-all", "--show-ends",
    "--show-nonprinting", "--show-tabs", "--squeeze-blank", "--version",
]
examples_safe = ["cat README.md", "cat src/main.rs", "cat ./notes.txt", "cat -n ./a.txt ./b.txt", "cat --show-all ./log.txt", "cat --version"]
examples_denied = ["cat ~/.ssh/id_rsa", "cat --bogus ./a.txt", "cat -z ./a.txt"]

# Declarative facet behavior: cat OBSERVES each positional (a read whose content flows to the
# model), gated per-operand by locus so `cat ~/.ssh/id_rsa` denies. No network, exec, or
# secret write — those facets come from the `observe`/`reads_content` builder. Replaces the
# hardcoded `resolve_cat`.
[command.behavior]
operation = "observe"
positionals = "read"
standalone = [
    "-A", "-b", "-e", "-E", "-n", "-s", "-t", "-T", "-u", "-v",
    "--number", "--number-nonblank", "--show-all", "--show-ends",
    "--show-nonprinting", "--show-tabs", "--squeeze-blank", "--help", "--version",
]
