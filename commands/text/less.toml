[[command]]
name = "less"
description = "Interactive terminal pager for viewing file contents with forward and backward navigation. Strictly read-only: never modifies the files it displays. A `+` operand is a command it runs as each file opens (`less +G` jumps to the end, and `less '+!id'` runs `id` in a shell). Loads files lazily, so it can handle very large inputs efficiently. Maintained as a standalone project by Mark Nudelman (greenwoodsoftware.com); releases are infrequent and the interface is very stable."
url = "https://man7.org/linux/man-pages/man1/less.1.html"
level = "Inert"
bare = true
reads_commands_from = ["plus"]
examples_safe = ["less +42 ./notes.md"]
examples_denied = ["less '+!id' ./notes.md", "less +G ./notes.md"]
standalone = [
    "-E", "-F", "-G", "-I", "-J", "-K", "-L", "-M", "-N", "-Q", "-R", "-S",
    "-V", "-W", "-X", "-a", "-c", "-e", "-f", "-g", "-i", "-m", "-n", "-q",
    "-r", "-s", "-w",
    "--QUIT-AT-EOF", "--RAW-CONTROL-CHARS", "--chop-long-lines", "--help",
    "--ignore-case", "--no-init", "--quiet", "--quit-at-eof",
    "--quit-if-one-screen", "--raw-control-chars", "--silent",
    "--squeeze-blank-lines", "--version",
]
# -t/--tag looks the tag up in ./tags, a project file read, which is deliberate. -T names any tags
# file and is left out: the file decides which file less opens.
valued = [
    "-P", "-b", "-h", "-j", "-p", "-t", "-x", "-y", "-z",
    "--LINE-NUMBERS", "--LONG-PROMPT", "--pattern", "--prompt",
    "--shift", "--tabs", "--tag", "--window",
]
