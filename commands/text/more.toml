[[command]]
name = "more"
description = "Simple terminal pager for viewing file contents with forward-only navigation. Strictly read-only: never modifies the files it displays. A `+` operand that is not a line number is a startup command: util-linux more searches with `+/pattern`, and the more macOS ships is less, which runs `+!id` as a shell command. Part of util-linux, which has a slow release cadence (major versions every 2-3 years); the more interface has been stable since the 1970s."
url = "https://man7.org/linux/man-pages/man1/more.1.html"
level = "Inert"
bare = true
reads_commands_from = ["plus"]
examples_safe = ["more +42 ./notes.md"]
examples_denied = ["more '+!id' ./notes.md"]
standalone = ["-V", "-c", "-d", "-f", "-h", "-l", "-s", "-u", "--help", "--version"]
valued = ["-n", "--lines"]
