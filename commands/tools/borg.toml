[[command]]
name = "borg"
description = "BorgBackup — deduplicating backup tool. Most subcommands contact the configured repository (local path or remote SSH — network for remote). Read-side: `info`, `list`, `extract --dry-run`, `check --verify-data`, `version`, `help`, `mount` (FUSE — interactive). Write-side: `init`, `create`, `delete`, `prune`, `recreate`, `compact`, `key`, `serve`, `umount`, `with-lock`, `import-tar`, `export-tar`. `check --repair` rewrites the repository to fix what it finds; `config` changes a repository or cache setting when given a value or `--delete` (`-d`)."
url = "https://borgbackup.readthedocs.io/en/stable/usage/general.html"
researched_version = "borgbackup 1.x"
bare_flags = ["--help", "--version", "-h", "-V"]
examples_safe = [
    "borg check repo",
    "borg config repo",
    "borg list repo",
    "borg info repo",
    "borg version",
    "borg --bypass-lock list repo",
    "borg --lock-wait 5 list repo",
    "borg list --first 3 repo",
    "borg list --format '{name}' repo",
    "borg check --archives-only repo",
    "borg config repo append_only",
]
examples_denied = [
    "borg --bypass-lock delete info ./repo",
    "borg --bypass-lock create check ./repo::a /",
    "borg --bypass-lock serve version",
    "BORG_PASSCOMMAND=/tmp/evil borg list repo",
    "borg config repo append_only 0",
    "borg config -d repo k",
    "borg config --delete ~/repo k",
    "borg config --delete repo",
    "borg config -d repo",
    "borg config -l -d repo",
    "borg check --repair repo",
    "borg check --repair --archives-only repo",
]

[command.wrapper]
standalone = ["--bypass-lock", "--consider-checkpoints", "--debug", "--info", "--no-cache-sync", "--progress", "--show-rc", "--show-version", "--verbose", "--warning"]
valued = ["--debug-topic", "--lock-wait", "--remote-path", "--remote-ratelimit", "--rsh", "--umask"]

# `--rsh` is the command borg RUNS to reach the repository (default `ssh`), and `--remote-path`
# is the borg executable invoked on the far side. Both name a program, so both take the executor
# gate: `read`/`write` would admit `/tmp`, which is exactly where a fetched script lands.
# `--patterns-from` and `--exclude-from` name a local file borg opens and reads line by line.
# `-e`/`--exclude` take a pattern, not a file; they are gated `read` as well so the short spelling
# beside `--exclude-from` is never the ungated one, which can only refuse a pattern spelled like a
# sensitive path.
[command.path_gate]
flags = { "--rsh" = "exec", "--remote-path" = "exec", "--patterns-from" = "read", "--exclude-from" = "read", "--exclude" = "read", "-e" = "read" }

[[command.sub]]
name = "version"
standalone = ["--help", "-h"]

[[command.sub]]
name = "info"
level = "SafeRead"
bare = false
tolerate_unknown_short = true
standalone = ["--help", "--json", "-h"]
valued = ["--exclude", "--exclude-from", "--first", "--last", "--match-archives", "--patterns-from", "--sort-by", "-a", "-e"]

[[command.sub]]
name = "list"
level = "SafeRead"
bare = false
tolerate_unknown_short = true
standalone = ["--help", "--json", "--json-lines", "--short", "-h"]
valued = ["--exclude", "--exclude-from", "--first", "--format", "--last", "--match-archives", "--patterns-from", "--sort-by", "-a", "-e"]

[[command.sub]]
name = "diff"
level = "SafeRead"
bare = false
tolerate_unknown_short = true
standalone = ["--exclude-caches", "--help", "--json-lines", "--numeric-ids", "--sort", "-h"]
valued = ["--exclude", "--exclude-from", "--exclude-if-present", "--patterns-from"]

[[command.sub]]
name = "check"
level = "SafeRead"
bare = false
tolerate_unknown_short = true
standalone = ["--archives-only", "--help", "--repository-only", "--save-space", "--verify-data", "-h"]
valued = ["--first", "--last", "--match-archives", "--max-duration", "--prefix", "--sort-by", "-a"]

[[command.sub]]
name = "config"
level = "SafeRead"
bare = false
standalone = ["--cache", "--help", "--list", "-c", "-h"]
max_positional = 2

[[command.sub]]
name = "help"
allow_all = true

[[command.sub]]
name = "init"
candidate = true

[[command.sub]]
name = "create"
candidate = true

[[command.sub]]
