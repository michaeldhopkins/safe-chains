[[command]]
name = "cucumber-js"
aliases = ["@cucumber/cucumber"]
description = "Cucumber.js — Node port of Cucumber. Reads .feature files and executes step-definition glue code (arbitrary JS). Same SafeRead profile as Ruby cucumber. Active project."
url = "https://github.com/cucumber/cucumber-js"
researched_version = "cucumber.js 11.x"
level = "SafeRead"
bare = true
standalone = [
    "--dry-run", "--exit", "--fail-fast",
    "--force-exit", "--help",
    "--profile", "--publish",
    "--publish-quiet", "--strict",
    "--no-strict",
    "--version",
    "-V", "-h", "-x",
]
valued = [
    "--backtrace", "--config", "--format",
    "--format-options", "--i18n-keywords",
    "--language", "--name", "--order",
    "--paths", "--require", "--require-module",
    "--retry", "--retry-tag-filter",
    "--tags", "--world-parameters",
    "-b", "-c", "-f", "-i", "-n",
    "-p", "-r", "-t", "-w",
]
examples_safe = ["cucumber-js"]

# A feature, a config, or a required module is code cucumber-js loads. `--format` / `-f`
# name the report file. The other values are languages, tags, counts, and names.
[command.path_gate]
positional = "exec"
flags = { "--config" = "exec", "-c" = "exec", "--require" = "exec", "-r" = "exec", "--require-module" = "exec", "--paths" = "exec", "--format" = "write", "-f" = "write", "--backtrace" = "ignore", "-b" = "ignore", "--format-options" = "ignore", "--i18n-keywords" = "ignore", "--language" = "ignore", "-i" = "ignore", "--name" = "ignore", "-n" = "ignore", "--order" = "ignore", "--retry" = "ignore", "--retry-tag-filter" = "ignore", "--tags" = "ignore", "-t" = "ignore", "--world-parameters" = "ignore", "-w" = "ignore", "-p" = "ignore" }
