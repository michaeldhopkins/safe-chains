[[command]]
name = "herb"
description = "HTML+ERB language tooling from herb-tools (Marco Roth) — a parser, linter, and formatter for HTML+ERB templates with a tree-sitter-style CST. Subcommands include `parse` (read-only AST dump), `lint` (read-only diagnostics; --fix rewrites files), `format` (--check is read-only; --write rewrites files), and `analyze` (read-only project-wide reports). The tool loads and parses templates but does not execute the embedded Ruby. Actively developed at herb-tools/herb with frequent releases."
url = "https://herb-tools.dev"
researched_version = "0.10.2 (herb gem v0.10.2, libherb v0.10.2; `herb lint --help` read on the installed binary)"
bare_flags = ["--help", "--version", "-h", "-V"]

[[command.sub]]
name = "parse"
bare = false
standalone = ["--help", "--json", "--no-color", "-h", "-j"]

[[command.sub]]
name = "lint"
level = "SafeRead"
standalone = [
    "--disable-failing",
    "--fix",
    "--fix-unsafely",
    "--force",
    "--github",
    "--help",
    "-h",
    "--ignore-disable-comments",
    "--init",
    "--json",
    "--no-custom-rules",
    "--no-github",
    "--simple",
    "--upgrade",
    "--version",
    "-v",
]
valued = ["--config-file", "-c", "--fail-level", "--format", "--jobs", "-j", "--theme"]
write_flags = ["--fix"]

[[command.sub]]
name = "format"
level = "SafeRead"
standalone = ["--check", "--color", "--help", "--no-color", "--write", "-h", "-w"]
valued = ["--config"]
write_flags = ["--write", "-w"]

[[command.sub]]
name = "analyze"
standalone = ["--help", "--json", "-h", "-j"]
valued = ["--config", "--format"]

# `--config-file`/`-c` names a `.herb.yml` that herb READS. It is data, not code: custom rules load
# from a fixed `.herb/rules/**/*.{mjs,js}` path that the config does not relocate, so this is an
# ordinary read at whatever locus the value points to rather than an executor.
[command.path_gate]
flags = { "--config-file" = "read", "-c" = "read" }

