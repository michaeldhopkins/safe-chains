[[command]]
name = "hugo"
description = "Hugo — Go-powered static site generator. Bare invocation runs `hugo build` and writes the generated site to ./public (project-local SafeWrite). `serve` / `server` runs the long-running dev HTTP server (loads the site config and theme code at startup). `new <kind> <path>` writes a content/site/theme/layout file. `mod <fetch|init|tidy|graph|verify|vendor>` fetches Go modules from the registry (network). `gen autocomplete/man/chromastyles/docs` writes generated reference files. `config <print|mounts>`, `env`, `version`, `list <drafts|expired|future|all>`, `check ulimit` are read-only diagnostics. Active project on the 0.x line."
url = "https://gohugo.io/commands/hugo/"
researched_version = "Hugo 0.x"
bare_flags = ["--help", "--version", "-h", "-V"]
examples_safe = ["hugo build -d ./public", "hugo build -s ./site", "hugo list drafts -s .", "hugo new content posts/x.md"]
examples_denied = ["hugo build -d /etc/out", "hugo build -s /etc", "hugo build --cacheDir /etc/cache", "hugo build --trace /etc/trace.out", "hugo new site /etc/site", "hugo new content posts/x.md --editor vim", "hugo build --memstats ~/Library/LaunchAgents/x", "hugo build -s /tmp/site", "hugo build --themesDir /tmp/themes -t evil", "hugo new content --config /tmp/c.toml x.md", "hugo build -e ../../../../tmp/evil", "hugo build -t github.com/evil/theme", "hugo new content -t github.com/evil/theme x.md", "hugo new content -k ../../../../tmp/evil x.md", "hugo build --config hugo.toml,/tmp/evil.toml"]

[command.path_gate]
flags = { "--destination" = "write", "-d" = "write", "--source" = "exec", "-s" = "exec", "--configDir" = "exec", "--themesDir" = "exec", "--layoutDir" = "exec", "-l" = "exec", "--contentDir" = "exec", "--environment" = "exec", "-e" = "exec", "--cacheDir" = "write", "--trace" = "write", "--logFile" = "write", "--memstats" = "write", "--dir" = "write", "--completionfile" = "write" }

[[command.sub]]
name = "version"
standalone = ["--help", "-h"]

[[command.sub]]
name = "env"
level = "Inert"
bare = true
standalone = ["--help", "-h"]

[[command.sub]]
name = "config"
nested_bare = true
standalone = ["--help", "-h"]

[[command.sub.sub]]
name = "print"
standalone = ["--help", "-h"]

[[command.sub.sub]]
name = "mounts"
standalone = ["--help", "-h"]

[[command.sub]]
name = "list"
nested_bare = true

[[command.sub.sub]]
name = "drafts"
standalone = ["--help", "-h"]
valued = ["--source", "-s"]

[[command.sub.sub]]
name = "expired"
standalone = ["--help", "-h"]
valued = ["--source", "-s"]

[[command.sub.sub]]
name = "future"
standalone = ["--help", "-h"]
valued = ["--source", "-s"]

[[command.sub.sub]]
name = "all"
standalone = ["--help", "-h"]
valued = ["--source", "-s"]

[[command.sub.sub]]
name = "published"
standalone = ["--help", "-h"]
valued = ["--source", "-s"]

[[command.sub]]
name = "check"
nested_bare = true

[[command.sub.sub]]
name = "ulimit"
standalone = ["--help", "-h"]

[[command.sub]]
name = "build"
writes_cwd = "output"
output_dirs = ["public", "resources"]
level = "SafeWrite"
bare = true
standalone = [
    "--cleanDestinationDir",
    "--debug", "--panicOnWarning",
    "--disableFastRender",
    "--enableGitInfo", "--forceSyncStatic",
    "--gc", "--help", "--ignoreCache",
    "--minify", "--noBuildLock", "--noChmod",
    "--noTimes", "--printI18nWarnings",
    "--printMemoryUsage", "--printPathWarnings",
    "--printUnusedTemplates", "--quiet",
    "--renderToMemory", "--templateMetrics",
    "--templateMetricsHints", "--verbose",
    "-D", "-E", "-F", "-h", "-q",
    "-v",
]
valued = [
    "--baseURL", "--cacheDir", "--clock",
    "--contentDir", "--destination",
    "--environment", "--i18n",
    "--configDir", "--layoutDir", "--logFile",
    "--logLevel", "--memstats",
    "--source",
    "--themesDir",
    "--trace", "--workers",
    "-b", "-d", "-e", "-l", "-s",
]

[[command.sub]]
name = "new"
level = "SafeWrite"
bare = false
standalone = ["--force", "--help", "--quiet", "-f", "-h"]
valued = ["--baseURL", "--contentDir", "--environment", "--kind", "--source", "-b", "-c", "-e", "-k", "-s"]

[[command.sub]]
name = "gen"
nested_bare = false

[[command.sub.sub]]
name = "autocomplete"
standalone = ["--help", "--type", "-h"]
valued = ["--completionfile", "--type"]

[[command.sub.sub]]
name = "chromastyles"
standalone = ["--help", "-h"]
valued = ["--highlightStyle", "--linesStyle", "--lineNumbersInlineStyle", "--style"]

[[command.sub.sub]]
name = "docs"
standalone = ["--help", "-h"]
valued = ["--dir"]

[[command.sub.sub]]
name = "man"
standalone = ["--help", "-h"]
valued = ["--dir"]

[[command.sub]]
name = "completion"
level = "Inert"
bare = false
tolerate_unknown_short = true
standalone = ["--help", "-h"]

[[command.sub]]
name = "help"
allow_all = true

[[command.sub]]
name = "serve"
candidate = true

[[command.sub]]
name = "server"
candidate = true

[[command.sub]]
name = "convert"
candidate = true

[[command.sub]]
name = "deploy"
candidate = true

[[command.sub]]
name = "import"
candidate = true

[[command.sub]]
name = "mod"
candidate = true
