[[command]]
name = "open"
description = "LaunchServices-backed file/URL opener. Without -a or -b, opens the file in the application registered for its type, so a .command, .terminal, .sh or .app operand runs code: Terminal executes a .command file and an .app launches. -a names an application by path, -b by bundle identifier, either of which launches it. URLs are opened in the registered handler (default browser for http(s); file:// and other schemes reach their own handlers). -e / -t edit the file in TextEdit or the default text editor; -f reads stdin into a temp file and opens it. -R reveals the file in Finder. -W waits for the launched app to exit. --env, --stdin/--stdout/--stderr, and --args influence the launched application's environment and arguments (--env DYLD_INSERT_LIBRARIES loads a library into it). Opens GUI applications that may then act independently."
url = "https://ss64.com/mac/open.html"
researched_version = "macOS 14 open(1)"
handler = "open"

[command.fallback]
level = "SafeRead"
standalone = ["-e", "-t", "-f", "-F", "-W", "-R", "-n", "-g", "-j", "-h"]
valued = ["-u"]
