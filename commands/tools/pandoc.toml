[[command]]
name = "pandoc"
description = "Universal document converter that parses markup and structured formats (Markdown, CommonMark, reStructuredText, HTML, LaTeX, Org, DocBook, Typst, DOCX, EPUB, ODT, Jupyter notebooks, CSV, TSV, JSON) into an AST and renders target formats to stdout by default. Writing to the filesystem requires explicit flags: `-o` / `--output` writes the converted document to a file, `--extract-media` writes embedded media assets into a directory, and `--log` writes JSON log messages to a file. Passing `-F` / `--filter` or `-L` / `--lua-filter` executes external filter programs or Lua scripts over the AST, `--pdf-engine` / `--latex-engine` invokes an external TeX or HTML-to-PDF engine binary, and `-d` / `--defaults` loads YAML option files that can enable filters, engines, or output files. When restricted to stdout conversion without output, media-extraction, log, defaults, engine, or filter flags, it operates as a local converter; local file operands, templates, headers, metadata files, and bibliographies are read from disk (while URL operands or `--request-header` can fetch remote HTTP resources). Actively maintained with frequent point releases and a well-documented option surface."
url = "https://pandoc.org/MANUAL.html"
researched_version = "pandoc 3.12.1"
level = "SafeRead"
bare = true
examples_safe = [
    "pandoc README.md",
    "pandoc -f markdown -t html README.md",
    "pandoc --from=gfm --to=plain --wrap=none README.md",
    "pandoc -s --toc --toc-depth=2 -V title=Spec docs/spec.md",
    "pandoc --citeproc --bibliography=refs.bib --csl=ieee.csl paper.md",
    "pandoc --standalone --mathjax --syntax-highlighting=pygments notes.md",
    "pandoc --list-input-formats",
    "pandoc --list-output-formats",
    "pandoc --version",
]
examples_denied = [
    "pandoc README.md -o out.html",
    "pandoc README.md --output=out.pdf",
    "pandoc --output out.docx README.md",
    "pandoc --extract-media=./media README.docx",
    "pandoc --extract-media ./media README.docx",
    "pandoc --lua-filter=filter.lua README.md",
    "pandoc -L filter.lua README.md",
    "pandoc --filter=pandoc-crossref README.md",
    "pandoc -F ./my-filter.py README.md",
    "pandoc -d defaults.yaml README.md",
    "pandoc --defaults=defaults.yaml README.md",
    "pandoc --pdf-engine=xelatex README.md",
    "pandoc --log=out.json README.md",
    "pandoc ~/.ssh/id_rsa",
]
standalone = [
    "--bash-completion", "--biblatex", "--citeproc",
    "--datadir", "--dump-args",
    "--help", "--ignore-args",
    "--list-highlight-languages", "--list-highlight-styles",
    "--list-input-formats", "--list-output-formats",
    "--mimex", "--natbib", "--no-highlight",
    "--parse-raw", "--quiet", "--smart",
    "--standalone", "--strip-empty-paragraphs",
    "--verbose", "--version",
    "-C", "-N", "-R", "-S",
    "-h", "-i", "-p", "-s", "-v",
]
valued = [
    "--abbreviations", "--base-header-level", "--bibliography",
    "--citation-abbreviations", "--columns", "--csl", "--css",
    "--data-dir", "--default-image-extension", "--dpi",
    "--email-obfuscation", "--eol", "--epub-chapter-level",
    "--epub-cover-image", "--epub-embed-font", "--epub-metadata",
    "--epub-stylesheet", "--epub-subdirectory",
    "--figure-caption-position", "--from", "--highlight-style",
    "--id-prefix", "--include-after-body", "--include-before-body",
    "--include-in-header", "--indented-code-classes", "--ipynb-output",
    "--katex-stylesheet", "--markdown-headings", "--metadata",
    "--metadata-file", "--number-offset", "--print-default-data-file",
    "--print-default-template", "--print-highlight-style", "--read",
    "--reference-doc", "--reference-location", "--request-header",
    "--resource-path", "--shift-heading-level-by", "--slide-level",
    "--split-level", "--syntax-definition", "--syntax-highlighting",
    "--tab-stop", "--table-caption-position", "--template",
    "--title-prefix", "--to", "--toc-depth", "--top-level-division",
    "--track-changes", "--variable", "--variable-json", "--wrap",
    "--write",
    "-A", "-B", "-D", "-H", "-M", "-T", "-V",
    "-c", "-f", "-r", "-t", "-w",
]
optional_valued = [
    "--ascii", "--atx-headers", "--embed-resources",
    "--epub-title-page", "--fail-if-warnings", "--file-scope",
    "--gladtex", "--html-q-tags", "--incremental", "--katex",
    "--link-images", "--list-extensions", "--listings",
    "--mathjax", "--mathml", "--no-check-certificate",
    "--number-sections", "--preserve-tabs", "--reference-links",
    "--sandbox", "--section-divs", "--self-contained",
    "--strip-comments", "--table-of-contents", "--toc",
    "--trace", "--webtex",
]
