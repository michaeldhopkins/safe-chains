[[command]]
name = "tsc"
description = "TypeScript compiler. With --noEmit, it type-checks the project and reports errors without producing any output files. Without --noEmit (not exposed here), it writes .js and .d.ts files to disk. Requiring --noEmit, --help, or --version ensures no file writes occur. TypeScript follows a roughly quarterly release cadence; TypeScript 7 (Go-based rewrite) is targeting mid-2026."
url = "https://www.typescriptlang.org/docs/handbook/compiler-options.html"
level = "Inert"
bare = false
require_any = ["--help", "--noEmit", "--version", "-h", "-v"]
examples_safe = [
    "tsc --noEmit",
    "tsc -p tsconfig.test.json --noEmit",
    "tsc --project ./sub/tsconfig.json --noEmit",
    "tsc src/index.ts --noEmit --pretty",
    "tsc -t es2020 -m esnext --noEmit",
]
examples_denied = [
    "tsc -p ~/.aws/credentials --noEmit --pretty",
    "tsc ~/.ssh/id_rsa --noEmit",
    "tsc -p tsconfig.json",
    "tsc -w --noEmit",
]
standalone = [
    "--allowJs", "--checkJs", "--esModuleInterop",
    "--forceConsistentCasingInFileNames", "--help", "--incremental",
    "--isolatedModules", "--noEmit", "--noFallthroughCasesInSwitch",
    "--noImplicitAny", "--noImplicitReturns", "--noUnusedLocals",
    "--noUnusedParameters", "--pretty", "--resolveJsonModule",
    "--skipLibCheck", "--strict", "--strictNullChecks",
    "--version",
    "-h", "-v",
]
# Short spellings sit beside their long forms. `tsc --help` gives them as pairs — `--project, -p`,
# `--target, -t`, `--module, -m` — and they are the same flag, so allowing one spelling and not the
# other refuses the operation on syntax rather than on behaviour. `npx tsc -p tsconfig.test.json
# --noEmit` prompted for exactly that reason while `--project` did not.
#
# Not added: `-w`/`--watch`, `-b`/`--build`, `-d`/`--declaration`. Those are absent in BOTH
# spellings and deliberately so — watch is long-running, and build and declaration emit files,
# which `require_any = --noEmit` exists to prevent.
valued = [
    "--baseUrl", "--jsx", "--lib", "--module",
    "--moduleResolution", "--project",
    "--rootDir", "--target",
    "-m", "-p", "-t",
]

# --noEmit stops tsc writing files; it does NOT stop it reading them, and tsc reports errors by
# quoting the offending source line. With --pretty (allowed above, and the default when stdout is a
# terminal) that quoting renders the file's CONTENT: `tsc -p ~/.aws/credentials --noEmit --pretty`
# parses the INI as JSON and prints every line it chokes on, key material included. Measured with a
# canary — it came back seven times.
#
# So the paths tsc is pointed at are the operation's real subject and are gated as `read`. The
# enum-valued flags are spelled out as `ignore` because a positional gate treats an undeclared
# valued flag's value as a path, and `--target es2020` names a language level, not a file.
[command.path_gate]
positional = "read"
flags = { "--project" = "read", "-p" = "read", "--baseUrl" = "read", "--rootDir" = "read", "--jsx" = "ignore", "--lib" = "ignore", "--module" = "ignore", "--moduleResolution" = "ignore", "--target" = "ignore", "-m" = "ignore", "-t" = "ignore" }
