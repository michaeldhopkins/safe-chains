[[command]]
name = "tsup"
description = "TypeScript library bundler built on esbuild. Reads source plus tsconfig.json and writes bundled output to dist/ (or --out-dir). --watch keeps a long-running process. Active project."
url = "https://tsup.egoist.dev/"
researched_version = "tsup 8.x"
level = "SafeWrite"
bare = true
standalone = [
    "--bundle", "--clean", "--cjs",
    "--dts", "--dts-only", "--dts-resolve",
    "--esm", "--external", "--global-name",
    "--help", "--keep-names",
    "--legacy-output", "--metafile",
    "--minify", "--no-clean",
    "--no-config", "--shims", "--silent",
    "--skip-node-modules-bundle",
    "--source-map", "--splitting",
    "--sourcemap", "--terser",
    "--treeshake", "--version", "--watch",
    "-h", "-w",
]
valued = [
    "--cjs-interop", "--config", "--define",
    "--entry", "--env", "--external",
    "--format", "--inject",
    "--name", "--no-external",
    "--out-dir", "--platform", "-d",
    "--public-dir", "--target",
    "--tsconfig",
]

# tsup.config.ts is code tsup evaluates. A positional or `--entry` is an input module, and
# `--inject` is a module spliced into every bundle. `--out-dir`/`-d` are writes.
[command.path_gate]
positional = "exec"
flags = { "--config" = "exec", "--entry" = "exec", "--inject" = "exec", "--out-dir" = "write", "-d" = "write", "--public-dir" = "read", "--tsconfig" = "read", "--cjs-interop" = "ignore", "--define" = "ignore", "--env" = "ignore", "--external" = "ignore", "--format" = "ignore", "--name" = "ignore", "--no-external" = "ignore", "--platform" = "ignore", "--target" = "ignore" }
