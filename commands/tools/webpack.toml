[[command]]
name = "webpack"
description = "Module bundler — reads entry files plus webpack.config.{js,cjs,mjs,ts}, applies loaders/plugins, and writes bundled assets to the configured output directory. The config file is itself JavaScript executed at startup, and loaders/plugins are arbitrary Node modules. Active project."
url = "https://webpack.js.org/api/cli/"
researched_version = "webpack 5.x"
level = "SafeWrite"
bare = true
standalone = [
    "--analyze", "--bail", "--cache", "--color",
    "--devtool", "--disable-interpret",
    "--env", "--extends", "--fail-on-warnings",
    "--help", "--hot", "--json",
    "--mode", "--no-cache", "--no-color",
    "--no-stats", "--no-watch", "--no-watch-options-stdin",
    "--profile", "--progress",
    "--target", "--version",
    "--watch", "--watch-options-stdin",
    "-d", "-h", "-j", "-t", "-v", "-w",
]
# `-o` is the short form of `--output-path` and takes a MANDATORY directory (`-o ./dist`).
valued = ["-c", "-o",
    "--config", "--config-name", "--entry",
    "--merge", "--name", "--node-env",
    "--output-clean", "--output-filename",
    "--output-path", "--output-public-path",
    "--source-map", "--stats",
]

# A webpack config is JavaScript that webpack EVALUATES, and a positional or `--entry` is the
# module graph's root. `-o` is the short form of `--output-path` (a write, including the central role).
[command.path_gate]
positional = "exec"
flags = { "--output-path" = "write", "-o" = "write", "--config" = "exec", "-c" = "exec", "--entry" = "exec", "--config-name" = "ignore", "--merge" = "ignore", "--name" = "ignore", "--node-env" = "ignore", "--output-clean" = "ignore", "--output-filename" = "ignore", "--output-public-path" = "ignore", "--source-map" = "ignore", "--stats" = "ignore" }
