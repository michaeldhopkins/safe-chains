[[command]]
name = "hg"
description = "Mercurial — distributed version control. Read-side: `log`, `diff`, `status`, `summary`, `id`, `paths`, `parents`, `heads`, `branch` (no args), `branches`, `bookmarks`, `tags`, `cat`, `annotate`, `manifest`, `files`, `grep`, `tip`, `version`, `config` (--show), `archive --dry-run`, `verify`, `outgoing` / `incoming` (network). Write-side: `commit`, `add`, `addremove`, `forget`, `remove`, `rename`, `copy`, `revert`, `import`, `export`, `bundle`, `merge`, `update`, `pull`, `push`, `clone`, `init`, `branch <name>`, `bookmark`, `tag`, `rollback`, `rebase`, `graft`, `histedit`, `strip`, `convert`."
url = "https://www.mercurial-scm.org/doc/hg.1.html"
researched_version = "Mercurial 6.x"
bare_flags = ["--help", "--version", "-h", "-v"]
examples_safe = [
    "hg log",
    "hg status",
    "hg st",
    "hg summary",
    "hg sum",
    "hg id",
    "hg identify",
    "hg blame foo.py",
    "hg annotate foo.py",
    "hg bookmarks",
    "hg bm",
    "hg config",
    "hg showconfig",
    "hg cat -o ./extracted-%s foo.py",
]
examples_denied = [
    "hg push",
    "hg commit",
    "hg pull",
]

# `hg cat -o/--output FORMAT` is not a format in the display sense — FORMAT is a filename template
# (`%s`, `%d`, `%p`, `%H` expand per file/revision), and Mercurial WRITES each extracted revision to
# the expanded name instead of stdout.
[command.path_gate]
flags = { "--output" = "write", "-o" = "write" }

# Mercurial reads these global options from anywhere in argv before it parses the subcommand, and
# that early pass skips options it does not know, so `hg status -T "$X"` applies a `--config` that
# "$X" expands to even though `-T` takes a value. Declaring them makes an unknown word in any hg
# argument count as possibly one of them.
[[command.flag]]
name = "--config"
classifies = "unclassified"
fact = "Sets a config value for this invocation, read in hg's early pass over all of argv; extensions.NAME=PATH imports and runs a Python file, and alias.NAME=!CMD defines a shell alias."
source = "https://repo.mercurial-scm.org/hg/file/tip/mercurial/dispatch.py — earlyoptions applied before extensions.loadall; fancyopts.earlygetopt gnu=True skips unknown options"
[[command.flag]]
name = "--repository"
classifies = "unclassified"
fact = "Points hg at another repository and loads that repository's .hg/hgrc, whose [extensions] and [hooks] run code."
source = "https://www.mercurial-scm.org/doc/hg.1.html — global options, `-R/--repository`; hgrc(5) [extensions]"
[[command.flag]]
name = "--repo"
classifies = "unclassified"
fact = "Abbreviation of --repository that hg's early pass accepts, with the same reach."
source = "https://repo.mercurial-scm.org/hg/file/tip/mercurial/dispatch.py — early options `-R`, `--repository`, `--repo`"
[[command.flag]]
name = "-R"
classifies = "unclassified"
fact = "Short form of --repository: loads another repository's .hg/hgrc."
source = "https://www.mercurial-scm.org/doc/hg.1.html — global options, `-R/--repository`"
[[command.flag]]
name = "--cwd"
classifies = "unclassified"
fact = "Changes directory before running, so the repository found there, and its .hg/hgrc, is the one loaded."
source = "https://www.mercurial-scm.org/doc/hg.1.html — global options, `--cwd`"

[[command.sub]]
name = "version"
standalone = ["--help", "-h", "--debug", "--hidden", "--noninteractive", "--quiet", "--time", "--traceback", "--verbose", "-q", "-v", "-y"]
valued = ["-T", "--template", "--color", "--encoding", "--encodingmode", "--pager"]

