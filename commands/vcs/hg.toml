bare = true
standalone = ["--copies", "--debug", "--follow", "--follow-first", "--git", "--graph", "--hidden", "--help", "--no-merges", "--patch", "--quiet", "--removed", "--reverse", "--stat", "--verbose", "-G", "-M", "-c", "-f", "-g", "-h", "-p", "-q", "-v", "-y", "--noninteractive", "--time", "--traceback", "--only-merges", "-m", "-C"]
valued = ["--branch", "--date", "--exclude", "--include", "--keyword", "--limit", "--prune", "--rev", "--style", "--template", "--user", "-T", "-X", "-d", "-k", "-l", "-r", "-u", "--color", "--encoding", "--encodingmode", "--pager", "--line-range", "-I", "-L", "-P", "-b"]

[[command.sub]]
name = "diff"
