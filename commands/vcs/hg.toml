bare = true
standalone = ["--change", "--git", "--ignore-all-space", "--ignore-blank-lines", "--ignore-space-change", "--ignore-space-at-eol", "--ignore-changes", "--mar", "--no-binary", "--no-dates", "--noprefix", "--nodates", "--patch", "--reverse", "--show-function", "--stat", "--text", "--unified", "--word-diff", "-B", "-Z", "-a", "-b", "-c", "-g", "-h", "-p", "-r", "-w", "--debug", "--hidden", "--noninteractive", "--quiet", "--time", "--traceback", "--verbose", "-q", "-v", "-y", "--binary", "--subrepos", "-S"]
valued = ["--change", "--exclude", "--include", "--rev", "--root", "--unified", "-I", "-U", "-X", "-c", "-r", "--color", "--encoding", "--encodingmode", "--pager"]

