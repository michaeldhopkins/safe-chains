[[command]]
name = "jj"
description = "Git-compatible version control system (Jujutsu) with automatic working-copy snapshots, first-class conflicts and an operation log that can undo any command. Observing subcommands (log, show, diff, status, file list/show, bookmark/tag/workspace/operation list and log, config get/list/path, root, help, version) read the repository and config and print to stdout; with a repository chosen by -R or --repository they read that one instead, and any jj command snapshots the working copy first, which writes to the repository's own store. Mutating subcommands (new, commit, describe, edit, rebase, squash, split, restore, abandon, absorb, duplicate, parallelize, bookmark create/set/move/delete/forget, git import, git init, workspace add/forget, undo) rewrite the local change graph and working-copy files, are reversible through the operation log, and never contact a remote; git init and workspace add also create a repository or workspace directory at any path they are given. git fetch is an outbound network read from the configured remotes and writes the fetched commits locally; git push uploads commits and moves remote bookmarks, which is remote and effectively irreversible; git clone and remote add/set-url name hosts. Several subcommands run programs named in configuration rather than by the command line: diff and split tools, merge tools (resolve, diffedit, -i/--interactive, --tool), the editor and pager, fix tools (jj fix), signing backends, jj run and jj util exec. The editor opens from describe and commit unless a description is given (-m, or --stdin for describe), from split likewise, and from squash when both sides of the squash carry a description, unless -m or -u settles it; split also opens the diff editor unless filesets are given, and resolve runs a merge tool unless --list. unsquash, deprecated in favour of squash, opens the editor the same way and has no message flag to settle it. Repository config lives in the user config directory under an id named by .jj/repo/config-id; with that file missing (a fresh repo, or one deleted) jj 0.45 reads .jj/repo/config.toml and migrates it there, so deleting config-id and writing that file takes effect on the next jj diff or log; and config set/unset/edit can write those very keys, so a config write is a deferred execution vector, not a contained local edit. --config, --config-file and --tool put such a program on the command line. Credentials are read only through git's own helpers during fetch and push. Pre-1.0, with a release about every month (0.46.0 on 2026-10-07) that adds, renames and removes subcommands and flags, so the surface needs ongoing review."
url = "https://docs.jj-vcs.dev/latest/cli-reference/"
researched_version = "jj 0.46.0 (CLI reference of 0.45.1 and the 0.46.0 changelog)"
bare_flags = ["--help", "--version", "-h"]
examples_safe = ["jj new", "jj describe -m x", "jj split -m x src/a.rs", "jj resolve --list", "jj -R ./sub new", "jj log -r @ --no-graph -T description", "jj diff --name-only -r @-", "jj status --no-pager"]
examples_denied = ["jj -R /etc new", "jj new -R /etc", "jj log -GR/etc", "jj log --bogus", "jj log --tool /tmp/x", "jj squash -i", "jj describe", "jj split -m x", "jj resolve", "jj fix", "jj git push", "jj config set --user ui.editor x"]
# Flags that take a value in every jj subcommand that has them (checked against
# `jj util markdown-help` for jj 0.45.1). Spellings that are a value flag in one sub and a switch
# in another (`-s`, `-b`, `-B`, `-n`, `-p`, `-t`) are left out.
flag_valued = [
    "--after", "--author", "--before", "--bookmark", "--branch", "--context", "--destination",
    "--file", "--from", "--insert-after", "--insert-before", "--into", "--limit", "--message",
    "--onto", "--op", "--operation", "--remote", "--revision", "--revisions", "--source",
    "--template", "--to", "-A", "-T", "-f", "-m", "-o", "-r",
]
[command.wrapper]
standalone = ["--debug", "--ignore-immutable", "--ignore-working-copy", "--no-pager", "--quiet", "--verbose"]
valued = ["--at-op", "--at-operation", "--color", "--repository", "-R"]

# `-R`/`--repository` picks the repo every sub acts on, so a write sub lands outside the workspace:
# `jj -R /etc new` created a commit in a repo under /etc and auto-approved. Gated at the WRITE locus
# rather than `exec` because jj mutates that repo's store — it does not run code out of it — so
# `-R /tmp/scratch-repo` stays workable while system and home paths do not.
[command.path_gate]
flags = { "--destination" = "ignore", "--repository" = "write", "-R" = "write" }

# jj's global options are accepted after the subcommand as well as before it, so a global that
# makes jj run a program is refused for the whole invocation rather than per sub.
# `--config`/`--config-file` can set `ui.diff-formatter`, `ui.pager`, `merge-tools.*.program` or
# `git.executable-path`; `--tool` names the program that renders a diff.
[[command.flag]]
name = "--config"
classifies = "unclassified"
fact = "Sets a config value for this invocation; keys such as ui.diff-formatter, ui.pager and merge-tools.*.program name a program jj runs."
source = "https://jj-vcs.github.io/jj/latest/config/ — `--config` and `ui.diff-formatter`"
[[command.flag]]
name = "--config-file"
classifies = "unclassified"
fact = "Loads an extra config file for this invocation, which can name programs jj runs (ui.diff-formatter, merge-tools.*.program)."
source = "https://jj-vcs.github.io/jj/latest/cli-reference/ — `--config-file`"
[[command.flag]]
name = "--config-toml"
classifies = "unclassified"
fact = "Older spelling of --config taking inline TOML, with the same reach."
source = "https://jj-vcs.github.io/jj/latest/cli-reference/ — `--config-toml`"
[[command.flag]]
name = "--tool"
classifies = "unclassified"
fact = "`jj diff/show/log --tool NAME` renders the diff by running NAME (a merge-tools entry, or else a program of that name) on two snapshot directories."
source = "https://jj-vcs.github.io/jj/latest/cli-reference/#jj-diff — `--tool`"

