[[command]]
name = "jj"
description = "Git-compatible version control system with an opinionated, simpler model — automatic working-copy commits, first-class conflicts, and operation log for undo. Read-only operations (log, diff, show, status, file show, bookmark list, config get/list/path) inspect repo state. Write operations (new, commit, describe, rebase, squash, split, abandon, restore) modify the local change graph but never contact the network. git fetch downloads from remotes; git push uploads — both are network operations. `config set`/`unset`/`edit` write config files: although local and offline, the value of a config key can name a program jj later executes — `git.executable-path`, `merge-tools.*.program`, `signing.backends.*.program`, `ui.pager`, `ui.editor` — so a single config write (e.g. `jj config set --user git.executable-path /tmp/x`) reconfigures how the next jj command runs and is a deferred code-execution vector, not a contained local edit; `config edit` additionally spawns $EDITOR. The CLI is evolving rapidly with releases roughly every 1-2 weeks (still pre-1.0); new subcommands and flag changes are frequent and require ongoing review."
url = "https://jj-vcs.github.io/jj/latest/cli-reference/"
researched_version = "jj 0.39.0 (config subcommand reviewed)"
bare_flags = ["--help", "--version", "-h"]
examples_safe = ["jj new", "jj -R ./sub new"]
examples_denied = ["jj -R /etc new"]
[command.wrapper]
standalone = ["--debug", "--ignore-immutable", "--ignore-working-copy", "--no-pager", "--quiet", "--verbose"]
valued = ["--at-op", "--at-operation", "--color", "--repository", "-R"]

# `-R`/`--repository` picks the repo every sub acts on, so a write sub lands outside the workspace:
# `jj -R /etc new` created a commit in a repo under /etc and auto-approved. Gated at the WRITE locus
# rather than `exec` because jj mutates that repo's store — it does not run code out of it — so
# `-R /tmp/scratch-repo` stays workable while system and home paths do not.
[command.path_gate]
flags = { "--repository" = "write", "-R" = "write" }

[[command.sub]]
name = "abandon"
level = "SafeWrite"
tolerate_unknown_short = true
tolerate_unknown_long = true

[[command.sub]]
name = "absorb"
level = "SafeWrite"
tolerate_unknown_short = true
tolerate_unknown_long = true

[[command.sub]]
name = "backout"
level = "SafeWrite"
tolerate_unknown_short = true
tolerate_unknown_long = true

[[command.sub]]
name = "cat"
tolerate_unknown_short = true
tolerate_unknown_long = true
bare = false

[[command.sub]]
name = "commit"
level = "SafeWrite"
tolerate_unknown_short = true
tolerate_unknown_long = true

[[command.sub]]
name = "describe"
level = "SafeWrite"
tolerate_unknown_short = true
tolerate_unknown_long = true

[[command.sub]]
name = "diff"
tolerate_unknown_short = true
tolerate_unknown_long = true
# `jj diff --name-only` prints workspace-relative paths, one per line — jj's own help recommends it
# for exactly this ("useful for shell commands like: jj diff -r @- --name-only | xargs ..."), so
# leaving the value unpinnable denied the idiom the tool documents.
#
# jj enforces the exclusivity itself, which is what makes this claim safe under
# `tolerate_unknown_long`: --template/--summary/--stat/--types are declared conflicting with
# --name-only and jj exits with an error rather than combining them. A future format flag would
# almost certainly join that conflict set; the ones known today are listed regardless, because a
# claim that leans on another layer breaks the moment that layer moves.
#
# `-R`/`--repository` is deliberately absent from `valued`: it points jj at ANOTHER repo, so its
# value SHOULD count as a root and worst-case the locus (`--repository /etc` → system → denied)
# rather than be skipped and let the claim keep reporting worktree.
# Verified against jj 0.39.0 (`jj diff --help`).
[command.sub.output]
locus_from = "operands"
requires = ["--name-only"]
invalidated_by = [
    "--color",
    "--config", "--config-file",
    "--debug",
    "--git", "--color-words",
    "--stat", "--summary", "--types",
    "--template", "-T",
    "--tool",
    "-s",
]
valued = ["--context", "--from", "--revisions", "--to", "-f", "-r", "-t"]

