# servers it starts. The cloud subcommands send the sign-in token to CODEX_CLOUD_TASKS_BASE_URL.
[env.CODEX_HOME]
shape = "opaque"
because = "codex reads config.toml from it, whose notify program and MCP server commands run"
measured = false
[env.CODEX_CLOUD_TASKS_BASE_URL]
shape = "opaque"
because = "codex cloud sends the ChatGPT sign-in token to this server"
measured = false

