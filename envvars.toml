# ── Config locations ─────────────────────────────────────────────────────────
# git and jj config can name programs they run (core.pager, diff tools, core.fsmonitor, aliases,
# ui.pager, merge-tools). A variable that moves where that config is read from passes only for a
# normal folder: never a temp root (which holds the session scratchpad) or a sibling project, where
# an agent can write a config file without being asked and then run it with `HOME=<there> git log`.
# `config-dir` is a directory whose config files programs read; `config-file` is the executor rule
# of `exec-path` with the same refusal added, since the executor rule alone admits the scratchpad.
