# ── Env twins of executor FLAGS ──────────────────────────────────────────────
# Each of these is the environment spelling of a flag that is already gated at the
# executor locus. Gating one spelling and not the other is not a partial fix: the
# ungated spelling is a complete bypass, and the flag gate reads as closed while it
# is not. `exec-path` (not `command`) so both spellings judge the value the same
# way — a bare name on $PATH stays trusted, a path into /tmp does not.
[env.BORG_RSH]
shape = "exec-path"
single_value = true
twin_flag = "borg --rsh {v} check repo"
twin_base = "borg check repo"
because = "borg runs this instead of ssh to reach the repository (the --rsh twin)"
[env.BORG_REMOTE_PATH]
