# ── Command lookup ───────────────────────────────────────────────────────────
# A bare name is trusted because it is found through PATH, so a PATH that names another folder makes
# every later bare name a program from that folder: `PATH=/tmp/evil ls` runs /tmp/evil/ls. An element
# placed after `$PATH` still matters, since a name the earlier folders lack is found there. zsh ties
# the `path` array to PATH, so `path+=/tmp/evil` appends a folder in the same way.
[env.PATH]
shape = "command-search"
because = "the shell finds every bare command name in these folders, in order (measured: PATH=<dir> and an empty PATH both ran a planted program named after a safe tool)"
[env.path]
shape = "command-search"
because = "zsh ties the path array to PATH, so assigning or appending to it changes where bare names are found (measured: path+=(.) ran a planted program)"

# ── Terminal multiplexers ────────────────────────────────────────────────────
# screen and tmux start the user's shell for every new window, and screen reads an rc file whose
# `screen` and `exec` lines start programs. A detached session needs no terminal, so each of these
# ran a planted script with nothing on the screen.
[env.SHELL]
shape = "shell-program"
because = "screen and tmux start it for each new window and run their command strings through it (measured: SHELL=./x.sh tmux new -d and screen -dm executed x.sh)"
[env.SCREENRC]
shape = "opaque"
because = "screen reads it in place of ~/.screenrc, and a screen line in it starts a program (measured: executes)"
[env.SYSSCREENRC]
shape = "opaque"
because = "screen reads it in place of /etc/screenrc, with the same commands as SCREENRC"
measured = false

# ── mise ─────────────────────────────────────────────────────────────────────
# mise reads every one of its settings from a MISE_<SETTING> variable, in front of mise itself and
# in front of any shim it installed (`cargo`, `node`). Several decide which config files load and
# whether they are trusted: MISE_TRUSTED_CONFIG_PATHS, MISE_YES and MISE_PARANOID skip the trust
# prompt; MISE_CONFIG_FILE, MISE_GLOBAL_CONFIG_FILE, MISE_SYSTEM_CONFIG_FILE, MISE_CONFIG_DIR,
# MISE_OVERRIDE_CONFIG_FILENAMES and MISE_ENV pick the files; MISE_DATA_DIR picks the plugins that
# run. A trusted config runs its hooks, tasks and [env] scripts, so the whole prefix is refused.
[env."MISE_*"]
shape = "opaque"
because = "every mise setting, including which config files load and whether they are trusted (measured: MISE_TRUSTED_CONFIG_PATHS made mise env run an untrusted config's _.source script)"

# ── codex ────────────────────────────────────────────────────────────────────
