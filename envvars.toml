# ── Env twins of flags we already gate ───────────────────────────────────────
# A tool that mirrors its config surface into the environment gives every guarded flag a second
# spelling. Found by sweeping for "a flag we deny that has an environment form"; in each case the
# danger was ALREADY documented in the command's own TOML and only the spelling went unchecked.

# `cargo test --config target.<triple>.runner=X` is denied; the env spelling was not. The runner
# executes the compiled test binary, so it is a plain command substitution. The `*` stands for the
# target triple, which is why an exact-name table could not reach it.
[env."CARGO_TARGET_*_RUNNER"]
shape = "command"
because = "cargo runs this to execute the built test/bench binary; the --config spelling is denied"
[env."CARGO_TARGET_*_LINKER"]
shape = "command"
because = "cargo invokes this as the linker for that target"

# `git -c <key>=<value>` is already classified PER KEY, with `core.pager`'s value recursed as a
# command. The environment spelling splits one assignment across three variables
# (GIT_CONFIG_COUNT / GIT_CONFIG_KEY_n / GIT_CONFIG_VALUE_n), so no single value can be judged on
# its own — `GIT_CONFIG_VALUE_0` is a command when the paired key is `core.pager` and inert when it
# is `user.name`. Presence denies, which matches the flag spelling: `git -c user.name=x log` already
# denies because that key is not on git's permitted list.
[env.GIT_CONFIG_COUNT]
shape = "opaque"
because = "injects arbitrary git config; the key/value pairing is split across other variables, so a single value cannot be certified"
[env."GIT_CONFIG_KEY_*"]
shape = "opaque"
because = "as GIT_CONFIG_COUNT"
[env."GIT_CONFIG_VALUE_*"]
shape = "opaque"
because = "as GIT_CONFIG_COUNT"
# The fourth spelling: git passes `-c` settings to its child processes in this variable, and obeys it
# when the caller sets it. One value carries any number of quoted pairs, `'core.pager'='sh -c x'` or
# `'safe.directory'='*'`.
[env.GIT_CONFIG_PARAMETERS]
shape = "opaque"
because = "injects arbitrary git config, as `git -c` does, for every git process that inherits it"
# fzf reads its options from the environment before its argument list, so every option the command
# line is checked for (`--bind`, `--preview`, `--listen`) has a second spelling here.
[env.FZF_DEFAULT_OPTS]
shape = "opaque"
because = "fzf parses this as options before its arguments, including ones that run commands"
[env.FZF_DEFAULT_OPTS_FILE]
shape = "opaque"
because = "a file of fzf options, read as FZF_DEFAULT_OPTS is"
[env.FZF_DEFAULT_COMMAND]
shape = "command"
because = "fzf runs this to list its input when stdin is a terminal"
[env.RIPGREP_CONFIG_PATH]
shape = "exec-path"
because = "a file of rg arguments, which can add --pre (a program rg runs on every file searched)"
[env.JJ_CONFIG]
shape = "config-file"
because = "a jj config file or directory, which can name programs jj runs (ui.pager, ui.diff-formatter, merge-tools)"
[env.JJ_EDITOR]
shape = "command"
because = "jj launches this for descriptions and interactive edits, ahead of ui.editor and EDITOR"
[env.ACK_PAGER]
shape = "command"
because = "ack pipes its output through this, as with --pager"
[env.ACK_PAGER_COLOR]
shape = "command"
because = "as ACK_PAGER, when output is colored"
[env.ACK_OPTIONS]
shape = "opaque"
because = "ack parses this as options before its arguments, including --pager"
[env.ACKRC]
shape = "opaque"
because = "an ack config file, which can set --pager or --follow; the one the user already has is read where it is"
[env.GHCRTS]
shape = "opaque"
twin_flag = "pandoc +RTS {v} -RTS README.md"
twin_base = "pandoc README.md"
because = "GHC runtime options in the environment (the +RTS twin): -t, -s and -S write statistics to a named file"
[env.COMMAND_MODE]
shape = "opaque"
because = "macOS commands read it to pick legacy behaviour, where ps -e shows each process's environment as -E does"
[env.GREP_OPTIONS]
shape = "opaque"
because = "BSD grep, as macOS ships it, parses this as options before its arguments, so -r turns a read of one file into a sweep of the folder"
[env.TAR_OPTIONS]
shape = "opaque"
because = "GNU tar parses this as options before its arguments, including --to-command and --use-compress-program, which run programs"
[env.TAPE]
shape = "opaque"
because = "tar, cpio and mt use this as the archive when -f is absent, so it is the -f twin for both reading and writing"
