# Environment variables whose VALUE changes what a command does.
#
# `VAR=value cmd` is not `cmd`. A leading assignment can make the process run different code, load
# code from a different place, or reach a different system — all without changing the command name
# safe-chains classifies. This file is the researched list of variables where that is true, and the
# SHAPE of each one's value so a rule we already have can judge it.
#
# ONLY THE NAMES LISTED HERE ARE INSPECTED. An unlisted assignment is ignored exactly as before, and
# the absence of an assignment changes nothing. This file adds no denials outside itself — it is not
# a switch that makes unknown environment variables suspicious. That property is deliberate and is
# what makes the list safe to grow one entry at a time.
#
# Nothing here is "forbidden" either. `GIT_DIR=/tmp/evil` denies because `/tmp` is out-of-worktree
# under the ordinary locus rules, and `GIT_PAGER=cat` passes because `cat` passes. The value is
# classified; the name only says HOW.
#
# shape:
#   command    the value is a command line → classified by `command_verdict`, the same recursion
#              `sudo X` already uses. `GIT_PAGER=cat` allows, `GIT_PAGER='sh -c evil'` denies.
#   exec-path  the value names a path SUPPLYING CODE → gated at the executor locus, like cargo's
#              `--manifest-path`. Worktree allows; /tmp, home and system paths deny. This is not the
#              read rule: `cat /tmp/x.so` is a fine read, while LOADING /tmp/x.so is not.
#   data-path  the value names a path read or written as DATA → ordinary read/write locus.
#   data-write the value names a file the process WRITES (a trace, a key log) → the write locus.
#   opaque     the value cannot be judged on its own → presence denies, whatever the value.
#   config-dir   the value is a directory whose config files programs read (HOME) → allowed only
#                when it is absolute and lies in the project or under $HOME, and neither it nor a
#                file in it is a temp root (so the session scratchpad), a sibling project, or the
#                projects folder above it, in any letter case. Every other folder is refused, since
#                macOS reaches /tmp by other names too (/System/Volumes/Data, /Volumes/<disk>, /.vol).
#                A relative value is refused: `git -C`, `jj -R` and the like resolve it from another
#                folder than the one the command starts in. A `for` loop over the variable is judged
#                item by item the same way, and `read` into it or a bash nameref (`declare -n`) is
#                refused, since either sets it without an assignment.
#   config-file  the value names a config file or repository that can name programs to run → the
#                exec-path rule, and never a temp root or sibling project either.
#   shell-program  the value names the shell a program starts for a new window or a shell escape →
#                allowed only as a shell (sh, bash, zsh, dash, ksh, tcsh, csh, fish) named in full
#                in a standard system bin directory (/bin, /usr/bin, /usr/local/bin,
#                /opt/homebrew/bin). A bare name is refused, so the program started is always one
#                named in full whatever PATH holds; a relative, home or temp path, a word carrying
#                arguments, or another program in those directories (make, an interpreter) is
#                refused too.
#   remote-shell the value is the remote shell rsync starts → allowed only as ssh or rsh with plain
#                options (no ProxyCommand, LocalCommand or config file), then gated as exec-path,
#                the same rule as rsync -e.
#   command-search the value is the list of directories the shell searches for a bare command name
#                → every element must be `$PATH` itself, a standard system bin directory (/bin,
#                /usr/bin, /usr/local/bin, /opt/homebrew/bin, /sbin, /usr/sbin), or an absolute
#                directory the exec-path rule admits (the project). An empty value or element, or a
#                relative one, searches the working directory, which can change, so it is refused.
#   shell-text   the value is pasted into a shell command line the program evaluates (macOS man is a
#                shell script that evaluates page paths and the output of `locale`) → refused when it
#                holds a backtick, $, a double quote, a backslash, ; | & ( ) < > or a line break;
#                otherwise inert.
#
# An entry may also carry `twin_flag` / `twin_base`, naming the FLAG spelling of the same thing:
#   twin_flag = "rsync -e {v} ./src/ ./dst/"   the flag invocation, `{v}` marking the value
#   twin_base = "rsync ./src/ ./dst/"          the command the variable prefixes
# `a_tagged_env_var_classifies_the_same_as_its_flag_twin` then holds the two spellings to the SAME
# verdict for a foreign path, a workspace path and a bare name. Tag every pair: gating one spelling
# and leaving the other open is a complete bypass that reads as a closed gate — which is exactly how
# `borg --rsh /tmp/evil` came to deny while `BORG_RSH=/tmp/evil borg` was approved.

# Every entry's `because` is the measured behaviour where one was taken; see
# docs/design/env-prefix-classification.md for the probes. Entries marked `measured = false` are
# enumerated from documentation because the toolchain was not installed to test against.

# ── Dynamic loader ───────────────────────────────────────────────────────────
# Injects code into the process before main. On macOS the DYLD_* pair is stripped by SIP for system
# binaries but honored for user-installed ones (Homebrew/cargo/npm) — which is most of a dev
# toolchain. LD_* is the Linux equivalent and is not restricted that way.
[env.LD_PRELOAD]
shape = "exec-path"
because = "loads an arbitrary shared object into the process before main"
[env.LD_AUDIT]
shape = "exec-path"
because = "loads an auditor library that observes and can alter symbol resolution"
[env.LD_LIBRARY_PATH]
shape = "exec-path"
because = "prepends a library search directory, so a planted .so satisfies a normal link"
[env.DYLD_INSERT_LIBRARIES]
shape = "exec-path"
because = "macOS loader injection; honored for user-installed binaries (measured)"
[env.DYLD_LIBRARY_PATH]
shape = "exec-path"
because = "macOS library search path"
[env.DYLD_FRAMEWORK_PATH]
shape = "exec-path"
because = "macOS framework search path"
# The rest of each loader's variables. glibc's LD_* and dyld's DYLD_* also include path searches
# (LD_ORIGIN_PATH, DYLD_FALLBACK_LIBRARY_PATH, DYLD_VERSIONED_*), a library-name swap
# (DYLD_IMAGE_SUFFIX), profiling (LD_PROFILE) and debug output written to a named file
# (LD_DEBUG_OUTPUT, LD_PROFILE_OUTPUT, DYLD_PRINT_TO_FILE). No build step sets one of these on a
# command line, so every name not listed above is refused whatever its value. LD_BIND_NOW and the
# like are refused with them; the cost is a debugging prefix that now asks.
[env."LD_*"]
shape = "opaque"
because = "the rest of glibc's loader variables: further library searches, LD_PROFILE, and debug output written to a named file"
measured = false
[env."DYLD_*"]
shape = "opaque"
because = "the rest of dyld's variables: fallback and versioned library searches, DYLD_IMAGE_SUFFIX, and DYLD_PRINT_TO_FILE"
measured = false

# ── C library: locale, conversion, resolver, allocator ───────────────────────
# glibc loads iconv converters as shared objects from GCONV_PATH, and getconf runs helper programs
# from GETCONF_DIR. Locale data and message catalogs are parsed binary files whose readers have had
# memory-safety bugs, so a foreign one is refused like code. GLIBC_TUNABLES and the MALLOC_*
# tunables only change allocator behaviour (their past exploit needed a setuid binary) and stay
# unlisted; MALLOC_TRACE names a file the process writes.
[env.GCONV_PATH]
shape = "exec-path"
because = "glibc iconv loads its converter modules (.so) from these directories"
measured = false
[env.GETCONF_DIR]
shape = "exec-path"
because = "glibc getconf runs the per-environment helper programs it finds in this directory"
measured = false
[env.NLSPATH]
shape = "exec-path"
because = "the template catopen() uses to find message catalogs, parsed binary files"
measured = false
[env.LOCPATH]
shape = "exec-path"
because = "glibc reads compiled locale data from here instead of the system locales"
measured = false
[env.MALLOC_TRACE]
shape = "data-write"
because = "glibc mtrace() writes its allocation trace to this file"
measured = false
[env.HOSTALIASES]
shape = "opaque"
because = "a file of host-name aliases the resolver applies, so a name resolves to another host"
measured = false
[env.RES_OPTIONS]
shape = "opaque"
because = "overrides resolv.conf options for the process"
measured = false
[env.LOCALDOMAIN]
shape = "opaque"
because = "replaces the resolver's search domains, so a short name resolves under another domain"
measured = false
[env."RESOLV_*"]
shape = "opaque"
because = "older glibc resolver settings (RESOLV_HOST_CONF names a host.conf to read)"
measured = false

