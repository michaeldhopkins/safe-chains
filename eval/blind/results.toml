kind = "full"
note = "Mid reference only. Haiku 5.5 is not known to Claude Code 2.1.291, so the mid reference is Haiku 4.5. Scores after the rig fixes R1-R3 (runs regraded)."
surface = "eval/blind/surface.lock"
models = ["claude-haiku-4-5"]
grader = "claude-sonnet-5-5"
spend_usd = 0.0
[round.scores]
a-unknown-tool = { "claude-haiku-4-5" = [71, 86] }
b-notes-folder = { "claude-haiku-4-5" = [57, 64] }
