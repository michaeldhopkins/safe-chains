# Blind weak-model evaluation of `safe-chains mcp` (eval/blind/README.md). One [[round]] per round,
# scores as a percent of each scenario's rubric, per model, per run. `tests/blind_eval_drift.rs`
# reads this file and surface.lock to say when the next round is due.

[[round]]
