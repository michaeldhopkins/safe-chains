[package]
name = "safe-chains-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
# The suggest target judges its own output by parsing it back.
toml = "0.9"
serde_json = "1"

[dependencies.safe-chains]
path = ".."

# Standalone workspace: this empty table SEVERS fuzz/ from the root workspace, so `cargo build` /
# `cargo test` / `cargo clippy` / `cargo deny` at the repo root never see it. The fuzz crate builds
# only under `cargo fuzz` (nightly, see rust-toolchain.toml) while the main crate stays on stable.
[workspace]

[[bin]]
name = "parse"
path = "fuzz_targets/parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "equivalence"
path = "fuzz_targets/equivalence.rs"
test = false
doc = false
bench = false

[[bin]]
name = "hook_envelope"
path = "fuzz_targets/hook_envelope.rs"
test = false
doc = false
bench = false

[[bin]]
name = "explain_render"
path = "fuzz_targets/explain_render.rs"
test = false
doc = false
bench = false

[[bin]]
name = "suggest_roundtrip"
path = "fuzz_targets/suggest_roundtrip.rs"
test = false
doc = false
bench = false

[[bin]]
name = "level_monotonic"
path = "fuzz_targets/level_monotonic.rs"
test = false
doc = false
bench = false

[[bin]]
name = "config_load"
path = "fuzz_targets/config_load.rs"
test = false
doc = false
bench = false

[[bin]]
name = "setup_merge"
path = "fuzz_targets/setup_merge.rs"
test = false
doc = false
bench = false
