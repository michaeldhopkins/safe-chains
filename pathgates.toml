[roles."webpack"]
flags = { "-o" = "write", "--output-path" = "write" }

[roles."vite"]
flags = { "--outDir" = "write" }

[roles."esbuild"]
flags = { "--outdir" = "write", "--outfile" = "write" }

[roles."tsup"]
flags = { "--out-dir" = "write", "-d" = "write" }

[roles."cjxl"]
shape = "last_write"

