# Filesystem region model (minimal, post-retreat).
#
# safe-chains classifies COMMANDS; it is deliberately NOT a filesystem trust database. Modeling
# "what every path on every machine means" is unbounded, per-machine, and drifts — and an
# adversarial audit of the old broad admit map (public /etc, /proc, /usr, /var/log, /Library)
# found it leaking (macOS keychain, Homebrew service configs, auth logs). Filesystem enforcement
# belongs to a sandbox / the OS / the harness, not a static string classifier (same scope stance
# as $PATH and hostile checkouts — see AGENTS.md §0.2).
#
# So this file is TINY and does only what a static classifier can honestly do:
#   • the WORKSPACE (relative paths under the harness cwd) is read/write — the agent was invited
#     there. That's the default `worktree` role; no node needed.
#   • a few `.git`/`.envrc`-style in-project files are read-safe but WRITE-frozen (a hook/direnv
#     write is code-injection).
#   • scratch (`/tmp`) and standard streams (`/dev/null`, fd pseudo-files) are read/write.
#   • a small CREDENTIAL SHIELD (`.ssh`, `.aws`, …) is denied and — crucially — a user grant can
#     NEVER widen it (see `apply_grant`), so `grant ~/` still can't hand over an SSH key.
#   • WRITES stop at the workspace, its siblings and scratch. Everything else is `unknown`, whose
#     write face is `machine` — above where writes reach — so it denies and the harness prompts.
#
# READS are the asymmetry, and it is deliberate. They run to the machine rung: `/etc/hosts`,
# `~/.zshrc`, `/usr/bin/python3`, a sibling checkout and a vendored crate source all read without
# a prompt, because confining reads to the worktree cost a prompt on nearly every legitimate thing
# an agent does and bought protection only for files that mostly are not secret. What bounds a
# read is therefore this file's shield — a test on the NAME — plus three rungs that sit ABOVE
# machine because they are not ordinary files at all: `device` (raw disks and memory),
# `system-integrity` (the trust substrate) and `kernel`.
#
# The shield being a name test is what forces the rest of the model. A name test can only answer
# about a path someone actually wrote down, so anything that reads files it never names has to be
# refused wholesale above the workspace: an unbounded sweep (`grep -r foo ~`), a glob (`/etc/*`), a
# traversal's placeholder (`find ~ -exec cat {}`) and an unpinnable path (`$SECRET`, a `..` with no
# cwd to resolve against). Those are not special cases bolted on; they are the same rule.
#
# Matching (header rules unchanged): a `path` ending `/` = SUBTREE prefix; ending `*` = STRING
# prefix; no `/` = SEGMENT (matches any path component == it, at any depth); else EXACT. Most
# specific wins; fail-closed to `unknown`. Credential shields are SEGMENTS so they bite whatever
# the spelling (`~/.ssh/id_rsa`, a relative `.ssh/id_rsa`, a `.ssh/` inside a granted tree).
#
# PROVENANCE: every node keeps a `note` (why it earns its role) and a dated `researched`.

# ── Roles: role → { read face, write face, rebind face, secret, frozen } ───────────────────
#
# THREE faces, not two. `read_locus` and `write_locus` are the obvious ones. `rebind_locus` is the
# locus of an operation that changes what the NAME refers to rather than the bytes under it: `rm`
# and `rmdir` unbind it, `ln` points it elsewhere, `mv` takes it away. It defaults to the write
# face and only needs stating where the two must differ.
#
# `frozen` says which face a user GRANT may not widen:
#   (absent)          a grant widens every face
#   frozen = "rebind" a grant may write INTO the node but never replace it
#   frozen = "write"  a grant may not write it at all, and therefore cannot rebind it either
#
# The distinction is load-bearing rather than decorative. Freezing the WRITE face of `~/.config` to
# stop `ln -s /tmp/evil ~/.config` also denied `cp x ~/.config`, which is an ordinary thing to do in
# a directory you granted. Freezing only the REBIND face keeps both answers right. It cannot be
# derived from the operation, because `cp x DIR` and `ln -s y DIR` are both `create`/`transfer` to
# the engine — `ln` declares `rebinds_destination` in its own TOML to separate them.
[role.worktree]
description = "The project tree (relative paths under the workspace). Read + write."
read_locus = "worktree"
write_locus = "worktree"
reads_secret = false

[role.worktree-trusted]
description = "In-project files another tool auto-executes (.git internals, .envrc). Read-safe; writes frozen (a hook/config write is code-injection)."
read_locus = "worktree-trusted"
write_locus = "worktree-trusted"
reads_secret = false

[role.scratch]
description = "Process-scoped temporary scratch."
read_locus = "temp"
write_locus = "temp"
reads_secret = false

[role.standard-stream]
description = "Standard streams / fd pseudo-files — no real filesystem is touched."
read_locus = "process"
write_locus = "process"
reads_secret = false

[role.raw-device]
description = "Raw block/char devices. Reading one is not reading a file — `/dev/rdisk0` is the whole disk and `/dev/mem` is physical memory, so both hand over every secret on the host in one operand. Sits at the `device` rung on both faces, which is ABOVE the machine rung ordinary local reads reach, so it stays refused when reads open up without needing to be enumerated as a secret."
read_locus = "device"
write_locus = "device"
reads_secret = false

[role.credential-store]
description = "Known credential/secret stores. Denied, and a user grant may NOT widen them (the shield)."
read_locus = "machine"
write_locus = "machine"
reads_secret = true

[role.safe-chains-config]
description = "safe-chains' own config. Read-OK, but write DENIED and un-grantable — an agent must not rewrite the file that governs what it may do. The write face sits at `system-integrity`, not `machine`: this file IS the classifier's trust substrate, and a level that admits ordinary machine administration must not thereby admit rewriting its own ceiling."
read_locus = "worktree-trusted"
write_locus = "system-integrity"
reads_secret = false
frozen = "write"

[role.trust-source]
description = "A file safe-chains derives its own trust from: a harness settings file it reads allow-rules or read-approvals out of. Write DENIED and un-grantable — an agent that rewrites one of these decides what safe-chains approves next. Unlike safe-chains' own config the READ face stays machine, because a harness settings file can carry an `env` block with API keys. Its write face sits at `system-integrity` for the same reason safe-chains own config does: a level admitting ordinary machine administration must not thereby admit rewriting the file that decides what gets approved next."
read_locus = "machine"
write_locus = "system-integrity"
reads_secret = false
frozen = "write"

[role.trust-root-dir]
description = "The DIRECTORY a trust file lives in. Writing a file into it is ordinary and stays grantable; REBINDING it is not, because replacing the directory points the trust root at somewhere else entirely and every file pin beneath it becomes irrelevant. A grant on such a directory therefore permits `cp x ~/.config` and refuses `rm -rf ~/.config` and `ln -s /tmp/evil ~/.config`. The REBIND face sits at `system-integrity` so the freeze survives a raised level, while the write face stays at `machine` and remains grantable."
read_locus = "machine"
write_locus = "machine"
rebind_locus = "system-integrity"
reads_secret = false
frozen = "rebind"

[role.unknown]
description = "Fail-closed default: any absolute/home path matching no region. Deny read & write (the harness then prompts)."
read_locus = "machine"
write_locus = "machine"
reads_secret = false

# ── In-project trust carve-outs: read-safe, write-frozen (code-injection) ───────────────────
[[region]]
path = ".git"
role = "worktree-trusted"
note = "Git metadata dir; hooks/ and config execute code on git operations, so a write is code-injection. Nests at any depth."
researched = "2026-07-12"
[[region]]
path = ".envrc"
role = "worktree-trusted"
note = "direnv auto-executes .envrc on cd into its directory; a write plants code that runs on the next shell entry."
researched = "2026-07-12"

# ── Scratch + standard streams: read/write ─────────────────────────────────────────────────
[[region]]
path = "/tmp/"
role = "scratch"
note = "FHS world-writable temp; ephemeral scratch. Both OSes (macOS /tmp symlinks to /private/tmp)."
researched = "2026-07-12"
[[region]]
path = "/var/tmp/"
role = "scratch"
note = "FHS temp preserved across reboots; still process-throwaway in intent."
researched = "2026-07-12"
[[region]]
path = "/private/tmp/"
role = "scratch"
os = ["macos"]
note = "macOS's real temp directory; /tmp is a symlink to here."
researched = "2026-07-12"
[[region]]
path = "/private/var/tmp/"
role = "scratch"
os = ["macos"]
note = "macOS real location of /var/tmp."
researched = "2026-07-12"
[[region]]
path = "/dev/null"
role = "standard-stream"
note = "POSIX bit-bucket; discards writes, empty on read."
researched = "2026-07-12"
[[region]]
path = "/dev/stdout"
role = "standard-stream"
note = "POSIX stdout pseudo-file — the process's own output stream."
researched = "2026-07-12"
[[region]]
path = "/dev/stderr"
role = "standard-stream"
note = "POSIX stderr pseudo-file — the process's own error stream."
researched = "2026-07-12"
[[region]]
path = "/dev/tty"
role = "standard-stream"
note = "The controlling terminal; process-local I/O."
researched = "2026-07-12"
[[region]]
path = "/dev/fd/"
role = "standard-stream"
note = "Per-process file-descriptor pseudo-files (process substitution). Process-local."
researched = "2026-07-12"
[[region]]
path = "/dev/"
role = "raw-device"
note = """
Everything else under /dev is a raw device until shown otherwise. The standard streams above are
Exact nodes and outrank this subtree, so they keep reading and writing normally.

Positive classification rather than a list of dangerous device names: `/dev/mem`, `/dev/kmem`,
`/dev/rdisk0`, `/dev/sda`, `/dev/nvme0n1` and every future spelling land here by default, and a
device that turns out to be ordinary can be given its own node. Enumerating the dangerous ones
would have to be complete to be worth anything.
"""
researched = "2026-08-12"
[[region]]
path = "/proc/*/environ"
role = "credential-store"
os = ["linux"]
note = "A process's environment block — where an agent's own API tokens and cloud keys live. Per-pid, so the component is a wildcard; /proc/self/environ matches it too."
researched = "2026-08-12"
[[region]]
path = "/proc/*/mem"
role = "credential-store"
os = ["linux"]
note = "A process's address space: every secret it has decrypted or been handed, readable as a file."
researched = "2026-08-12"
[[region]]
path = "/proc/*/cmdline"
role = "credential-store"
os = ["linux"]
note = "A process's argv, which routinely carries tokens passed as flags (`--password`, `--token`)."
researched = "2026-08-12"
[[region]]
path = "~/.local/state/safe-chains/"
role = "credential-store"
note = """
safe-chains' own decision log. It records every command it classified, verbatim and by design —
`--log-everything` was specified as logging the whole line without redaction, on the grounds that
it is opt-in — so it accumulates whatever secrets appeared on a command line: tokens passed as
flags, env prefixes, here-doc bodies.

That makes it a credential store we KNOW the contents of rather than one we guess at, and the one
file the classifier is directly responsible for creating. It surfaced as readable in the diff
against 0.226.0, alongside the ordinary home reads this release intends.
"""
researched = "2026-08-12"
[[region]]
path = "/var/log/auth.log"
role = "credential-store"
os = ["linux"]
note = "Authentication log — sudo/su/ssh events, and passwords typed into a username prompt land here verbatim."
researched = "2026-08-12"
[[region]]
path = "/var/lib/mysql/"
role = "credential-store"
os = ["linux"]
note = "MySQL/MariaDB data directory. The `mysql.user` table lives here as a file, so the password hashes for every database account are readable straight off disk."
researched = "2026-08-12"
[[region]]
path = "/var/lib/postgresql/"
role = "credential-store"
os = ["linux"]
note = "PostgreSQL data directory — `pg_authid` carries the role password hashes, and pgpass/certs are commonly kept alongside."
researched = "2026-08-12"
[[region]]
path = "/var/log/secure"
role = "credential-store"
os = ["linux"]
note = "The RHEL/Fedora spelling of auth.log."
researched = "2026-08-12"

# ── Package CONTENT: read-admitted, writes still denied. ───────────────────────────────────────
#
# The retreat deleted a broad admit map because an adversarial audit found it leaking — macOS
# `/Library/Keychains/System.keychain`, Homebrew `/usr/local/etc/*` service configs, `/var/log/*`
# auth tokens. That map failed because it admitted whole ROOTS, and a root is HETEROGENEOUS:
# `/usr/local` holds distributed package files next to machine-local config and state.
#
# These nodes cut at the layer the FHS already separates. `share`/`include`/`lib` is content a
# PACKAGE MANAGER put there; `etc` and `var` are this machine's config and state, which is where
# every audited leak lived. None of the three audit findings matches a prefix below: `/Library`
# is admitted only at `Developer/CommandLineTools/`, `etc` is never admitted at any root, and
# `/var` is not a root here at all.
#
# The argument for reading these at all: the content is public by construction. A crate README
# under `~/.cargo/registry` is published on crates.io; a man page ships in the OS. Refusing the
# local copy while the same bytes are a network fetch away is friction without a matching risk.
# WRITES stay denied — this widens disclosure only, not the ability to alter what runs.
[[region]]
path = ".ssh"
role = "credential-store"
note = "SSH private keys / authorized_keys / known_hosts — credential + trust store."
researched = "2026-07-12"
[[region]]
path = ".aws"
role = "credential-store"
note = "AWS access keys / session credentials."
researched = "2026-07-12"
[[region]]
path = ".gnupg"
role = "credential-store"
note = "GnuPG private keyring and trust database."
researched = "2026-07-12"
[[region]]
path = ".kube"
role = "credential-store"
note = "Kubernetes kubeconfig — cluster credentials and tokens."
researched = "2026-07-12"
[[region]]
path = ".docker"
role = "credential-store"
note = "Docker registry auth tokens / credential-helper config."
researched = "2026-07-12"
[[region]]
path = ".netrc"
role = "credential-store"
note = "Plaintext machine login credentials for ftp/curl/git."
researched = "2026-07-12"

# ── Credential DOTFILES. A prerequisite for admitting home dotfiles at all, not a follow-up. ──
#
# Home dotfiles are simultaneously the most ordinary read on the disk (`.zshrc`, `.gitconfig`) and
# the densest concentration of plaintext credentials on it. `home_role` currently excludes any hidden
# component for that reason — but measured, that exclusion protects nothing once local reads open:
# an excluded dotfile falls through to `unknown` → `machine`, and `machine` reads are exactly what
# the read policy admits. `cat ~/.git-credentials` ALLOWS with the cap lifted. These nodes are the
# only thing that will actually stand in front of them.
#
# SEGMENT matches for the bare filenames, so a project-local copy is shielded too — a repo `.npmrc`
# carries the same `_authToken` as the home one. Over-denying an innocent one is the accepted trade
# the shield header already states.
[[region]]
path = ".git-credentials"
role = "credential-store"
note = "git-credential-store's default file: one plaintext `https://user:pass@host` per line. Its XDG twin `~/.config/git/credentials` is already covered by the `~/.config/git/` node. Verified: git-scm.com/docs/git-credential-store."
researched = "2026-08-15"
[[region]]
path = ".npmrc"
role = "credential-store"
note = "npm config; holds `//registry.example/:_authToken=…` registry tokens. Segment-matched so a project-local .npmrc is shielded too — it carries the same token."
researched = "2026-08-15"
[[region]]
path = ".pypirc"
role = "credential-store"
note = "PyPI upload credentials — `username`/`password` or an API token per repository section."
researched = "2026-08-15"
[[region]]
path = ".pgpass"
role = "credential-store"
note = "libpq password file, `host:port:db:user:password` per line. Postgres refuses it unless mode 0600, which is the tell."
researched = "2026-08-15"
[[region]]
path = ".my.cnf"
role = "credential-store"
note = "MySQL client config; `[client] password=` is the documented way to avoid typing it."
researched = "2026-08-15"
[[region]]
path = ".dockercfg"
role = "credential-store"
note = "The pre-1.7 Docker registry auth file (base64 user:pass). Superseded by ~/.docker/config.json, which the `.docker` segment already shields, but still read by older tooling."
researched = "2026-08-15"
[[region]]
path = ".terraform.d"
role = "credential-store"
note = "Holds credentials.tfrc.json — the Terraform Cloud/Enterprise API token. A SEGMENT, like `.ssh`/`.aws`: written with a trailing slash it became a subtree PREFIX anchored at the start of the path, which matched nothing real and let `$(fd pat /work)/.terraform.d` out-permit the literal `/work/.terraform.d` — caught by substitution_is_never_more_permissive_than_a_path_it_could_produce."
researched = "2026-08-15"
[[region]]
path = "~/.azure/"
role = "credential-store"
note = "Azure CLI token cache (msal_token_cache.json / accessTokens.json) and the active subscription profile."
researched = "2026-08-15"
[[region]]
path = "~/.cargo/credentials"
role = "credential-store"
note = "crates.io registry token. Cargo writes `credentials.toml` since 1.68 but still reads and prefers the extensionless name when both exist, so BOTH are shielded. Deliberately exact paths, not a `.cargo` segment: the sibling `~/.cargo/registry/` is published crate source and stays readable. Verified: doc.rust-lang.org/cargo/reference/config.html."
researched = "2026-08-15"
[[region]]
path = "~/.cargo/credentials.toml"
role = "credential-store"
note = "As above — the current default spelling of the crates.io token file."
researched = "2026-08-15"
[[region]]
path = "~/.gem/credentials"
role = "credential-store"
note = "RubyGems `:rubygems_api_key:` — the push token."
researched = "2026-08-15"
[[region]]
path = "~/.m2/settings.xml"
role = "credential-store"
note = "Maven `<server><password>` entries for deploy repositories."
researched = "2026-08-15"
[[region]]
path = "~/.gradle/gradle.properties"
role = "credential-store"
note = "Conventional home for signing keys and repository credentials (`signing.password`, `*.apiKey`)."
researched = "2026-08-15"
[[region]]
path = "~/.composer/auth.json"
role = "credential-store"
note = "Composer HTTP-basic and OAuth tokens for private PHP package repositories."
researched = "2026-08-15"
# ── Second pass. The first list was assembled from memory and an adversarial probe found ten more
