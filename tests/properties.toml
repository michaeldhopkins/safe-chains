# Every file under src/, classified. `tests/properties.rs` enforces it.
#
# `pure`: behaviour is a function of the inputs (the classifier reads HOME and a thread-local
# directory context, but a property fixes both, so the classifier modules count as pure). Each
# names the property tests stating its invariants: a bare name is a fn inside a `proptest!` block
# in that file, `"src/x.rs::name"` one in another file (most of this crate's properties live in
# whole-file suites). A pure file with none yet goes in `owed`, which may only shrink: a file
# that gains a property leaves it in the same change.
#
# `effectful`: does I/O, owns process-wide state loaded from disk, or is module wiring with no
# logic of its own, with the reason. `test_only`: a whole-file test suite.
#
# Example-only and registry-sweep tests (`every_*`) are not properties here: a property states an
# invariant over generated inputs.

